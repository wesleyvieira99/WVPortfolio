é dinheiro."},{"type":"h2","text":"11. Escalabilidade horizontal"},{"type":"p","text":"Outro benefício importante é que o Demux pode ser executado em múltiplas instâncias, podendo ser escalado via autoscale para, de forma automática, se adequar ao tráfego dos N consumidores. O importante é que o ajuste de performance fica em uma peça central e única, retirando de cada consumidor app a responsabilidade única de escalabilidade entre conexão e conectado."},{"type":"p","text":"Por exemplo:"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQFfMbGLfmnPiw/article-inline_image-shrink_1500_2232/B4DZ_5D52HJsAQ-/0/1786589978456?e=2147483647&v=beta&t=Xlim3-RbD-CH1z_fFqhwgsMzuqyX__suF6ZQWe5pRL4","alt":"Article content","local":"article-inline-6920ff9c23e57b16.png"},{"type":"p","text":"Isso permite escalar horizontalmente a camada de entrada, mas existe uma pergunta adicional:"},{"type":"p","text":"o protocolo exige afinidade ou estado por conexão?"},{"type":"p","text":"Se exigir, a arquitetura precisa considerar cuidadosamente:"},{"type":"li","text":"connection affinity;"},{"type":"li","text":"estado de sessão;"},{"type":"li","text":"distribuição das conexões;"},{"type":"li","text":"reconexão;"},{"type":"li","text":"armazenamento compartilhado;"},{"type":"li","text":"comportamento do protocolo."},{"type":"p","text":"Esse é outro exemplo de como uma decisão aparentemente simples pode esconder detalhes arquiteturais importantes."},{"type":"h2","text":"12. O Demux como estratégia de modernização de legado"},{"type":"p","text":"Talvez esse seja o maior potencial dessa arquitetura, imagine uma empresa que possui um sistema legado de 15 anos. Ele funciona, mas ninguém quer mexer nele, ao mesmo tempo, novos parceiros precisam ser integrados. Você poderia tentar reescrever tudo, ou pode criar uma fronteira."},{"type":"p","text":"O Demux permite criar uma espécie de anti-corruption layer entre mundos arquiteturais diferentes. O legado continua existindo, mas sua complexidade deixa de contaminar toda a arquitetura moderna."},{"type":"p","text":"Isso é extremamente valioso em grandes organizações, porque modernização raramente acontece em um único grande “big bang”, ela acontece por estrangulamento progressivo do legado (padrão conhecido no mundo arquitetural como strangler fig)."},{"type":"blockquote","text":"O termo strangler fig (figueira estranguladora) refere-se tanto a uma planta tropical que germina no alto de uma árvore hospedeira, envolvendo-a e substituindo-a com o tempo, quanto a um padrão de arquitetura de software (veja a documentação da Microsoft Learn) usado para migrar sistemas legados monolíticos em partes graduais.","links":[{"text":"Microsoft Learn","url":"https://learn.microsoft.com/pt-br/azure/architecture/patterns/strangler-fig"}]},{"type":"h2","text":"A grande lição arquitetural"},{"type":"p","text":"O mais interessante nesse padrão não é o código Java."},{"type":"p","text":"Não é o NLB."},{"type":"p","text":"Não é o ALB."},{"type":"p","text":"Não é nem mesmo a AWS."},{"type":"p","text":"A grande ideia é outra:"},{"type":"blockquote","text":"Uma restrição de infraestrutura pode se transformar em uma oportunidade de arquitetura."},{"type":"p","text":"A Segurança pode dizer:"},{"type":"blockquote","text":"“Uma única porta.”"},{"type":"p","text":"O arquiteto não precisa responder:"},{"type":"blockquote","text":"“Então não dá.”"},{"type":"p","text":"Ele pode responder:"},{"type":"blockquote","text":"“Tudo bem. Vamos transformar essa única porta em uma fronteira inteligente.”"},{"type":"p","text":"E dessa decisão nasce uma arquitetura capaz de:"},{"type":"li","text":"centralizar entrada;"},{"type":"li","text":"isolar protocolos;"},{"type":"li","text":"reduzir acoplamento;"},{"type":"li","text":"padronizar comunicação;"},{"type":"li","text":"preservar sistemas legados;"},{"type":"li","text":"acelerar novas integrações;"},{"type":"li","text":"escalar horizontalmente;"},{"type":"li","text":"melhorar observabilidade;"},{"type":"li","text":"reduzir superfície exposta;"},{"type":"li","text":"e permitir que os times de negócio trabalhem com APIs modernas."},{"type":"p","text":"O Demux é um conceito antigo, mas a ideia continua extremamente atual, ele resolve um problema clássico de arquitetura:"},{"type":"blockquote","text":"Como receber múltiplos mundos diferentes através de uma única fronteira e, ainda assim, manter o sistema interno organizado?"},{"type":"p","text":"A resposta é criar uma camada especializada que compreenda o mundo externo e entregue ao mundo interno uma interface padronizada."},{"type":"p","text":"Na AWS, uma combinação como:"},{"type":"p","text":"NLB → Demux → ALB → Microsserviços"},{"type":"p","text":"pode transformar uma arquitetura de integração extremamente complexa em uma plataforma mais organizada, observável e escalável."},{"type":"p","text":"E talvez a maior lição seja justamente essa:"},{"type":"p","text":"bons arquitetos e engenheiros de software não eliminam as restrições, eles entendem as restrições profundamente e descobrem como transformá-las em decisões arquiteturais inteligentes."},{"type":"h3","text":"💬 E você?"},{"type":"p","text":"Já encontrou uma arquitetura em que uma única porta, um protocolo legado ou uma restrição de infraestrutura parecia inicialmente um problema, mas acabou virando a oportunidade para redesenhar toda a solução?"},{"type":"p","text":"Às vezes, a melhor arquitetura nasce justamente da restrição que parecia impossível de contornar."},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQE7ETPM0dWRKg/article-inline_image-shrink_1000_1488/B4DZ_5Fm8dKAAI-/0/1786590425344?e=2147483647&v=beta&t=z66l6XsgyFKVAaJ687QuSjD-STgUv_3hinIMPzPlDMQ","alt":"Article content","local":"article-inline-ff78a58e081c624c.png"}],"retrieved":"2026-10-07"},"4":{"id":4,"title":"DB2 ou NoSQL: entre a vanguarda e o moderno, qual caminho seguir?","url":"https://www.linkedin.com/pulse/db2-ou-nosql-entre-vanguarda-e-o-moderno-qual-caminho-wesley-vieira-phkwf/","blocks":[{"type":"p","text":"Imagine que você está em uma reunião e alguém pronuncia as palavras Mainframe e DB2. Para muita gente, especialmente quem trabalha com tecnologias mais novas, bate um frio na barriga instantâneo. Parece que estamos falando de um museu da tecnologia, cheio de telas pretas com letrinhas verdes."},{"type":"p","text":"Mas a verdade é muito mais interessante. Se você passou um cartão de crédito hoje, pagou uma conta ou comprou algo no supermercado, você usou um Mainframe e muito provavelmente o DB2 estava lá, trabalhando silenciosamente nos bastidores."},{"type":"p","text":"É importante saber e entender o que é o DB2, por que ele é tão importante e como ele se conecta perfeitamente com o mundo atual. Tudo isso sem usar termos complicados e, principalmente, sem medo. Afinal, ele mais ajuda e apoia os sistemas críticos do seu dia a dia do que se parece."},{"type":"h3","text":"Pense em um Cofre e uma Mochila"},{"type":"p","text":"Para entender o DB2 e compará-lo com os bancos de dados modernos, como o NoSQL, pense em como você guarda suas coisas."},{"type":"p","text":"Os bancos de dados modernos, como o NoSQL, são como uma mochila super prática e flexível. Você pode jogar qualquer coisa lá dentro: chaves, um casaco, o carregador do celular. Tudo entra fácil, não exige muita organização prévia e você resolve seu problema de mobilidade muito rápido. É excelente para aplicativos de celular que precisam mudar o tempo todo."},{"type":"p","text":"Já o DB2 rodando em um Mainframe é como o cofre central de segurança máxima de um banco. Ele não foi feito para você jogar coisas de qualquer jeito. Ele tem regras muito estritas, gavetas organizadas milimetricamente e portas de aço reforçado."},{"type":"p","text":"Por que toda essa rigidez? Porque se esse cofre falhar, o banco inteiro quebra. O DB2 foi criado para garantir que cada centavo da sua conta bancária esteja exatamente onde deveria estar, sem margem para erros, processando bilhões de transações por segundo."},{"type":"h3","text":"O que exatamente é o DB2 no Mainframe?"},{"type":"p","text":"Para quem não é da área de tecnologia, um banco de dados é apenas um sistema digital que guarda informações. O DB2 é um sistema de banco de dados relacional criado pela IBM. Isso significa que ele guarda os dados em tabelas perfeitamente organizadas que se relacionam entre si."},{"type":"p","text":"O Mainframe é o supercomputador onde esse banco de dados mora. Ele é o verdadeiro trator da tecnologia, desenhado para nunca ser desligado e nunca travar, mesmo quando o mundo inteiro decide fazer compras online na Black Friday."},{"type":"h3","text":"O mundo moderno e o fim do medo"},{"type":"p","text":"Aqui vai o recado para os programadores modernos que amam a nuvem (assim como eu), trabalham com NoSQL e acham que o DB2 é uma tecnologia ultrapassada. Não tenham medo de tocar no Mainframe."},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQFuBwdOILVj1g/article-inline_image-shrink_1500_2232/B4DZ_SQuPOI8AQ-/0/1785939027376?e=2147483647&v=beta&t=Rv9_KPWvUgtrLNY0NnLvPfUUAflFL8A2Suibxodd5Is","alt":"Article content","local":"article-inline-869ea97b3a84a9b6.png"},{"type":"p","text":"A grande sacada da tecnologia atual não é substituir o cofre pela mochila, mas sim fazer os dois trabalharem juntos. A modernização chegou com força ao Mainframe. Hoje, o DB2 não vive mais isolado em seu próprio mundo. Ele aprendeu a falar a língua da internet."},{"type":"p","text":"Sistemas modernos e aplicativos de celular se comunicam com o DB2 o tempo todo através de APIs, que são como pontes digitais padronizadas. Você pode programar na linguagem mais moderna que existir e ainda assim buscar dados com facilidade dentro do DB2."},{"type":"p","text":"E mais: o próprio DB2 se modernizou por dentro. Hoje ele consegue entender e processar formatos de dados super modernos e flexíveis, funcionando em harmonia com as ferramentas que os desenvolvedores mais jovens adoram usar."},{"type":"h3","text":"O futuro é híbrido"},{"type":"p","text":"Entender o DB2 é perceber que ele é o motor invisível da nossa economia. A agilidade da mochila dá velocidade para criarmos novos aplicativos coloridos e cheios de funções para os clientes. Mas é a solidez do cofre que garante que, no fim do dia, a transação financeira aconteça com total segurança."},{"type":"p","text":"Agora que já entendemos o conceito geral, vamos abrir o capô e olhar como o motor funciona de verdade. Muita gente foge dos termos técnicos e dos códigos por achar que é um bicho de sete cabeças. No entanto, a lógica do DB2 é  simples e genial quando a conectamos com coisas que fazemos todos os dias."},{"type":"p","text":"Vamos colocar o DB2 e o NoSQL lado a lado na prática."},{"type":"blockquote","text":"A Estrutura: Planilha Rigorosa (DB2) vs Pasta de Arquivos (NoSQL)"},{"type":"p","text":"No DB2, dizemos que o banco de dados é Relacional. Para visualizar isso, pense em uma planilha de Excel extremamente rigorosa. Antes de guardar qualquer informação, você precisa criar uma estrutura fixa (o que chamamos de Schema ou Tabela). Se a coluna foi criada para receber números, o DB2 nunca vai deixar você salvar uma palavra lá dentro. Essa rigidez é o que garante a qualidade dos dados."},{"type":"p","text":"Veja como é o código em SQL (a linguagem que o DB2 entende) para criar um cadastro e buscar um cliente:"},{"type":"pre","text":"/* 1. Primeiro criamos a estrutura fixa (a Tabela) */\nCREATE TABLE CLIENTES (\n    ID INT PRIMARY KEY,\n    NOME VARCHAR(100),\n    SALDO DECIMAL(10,2)\n);\n\n/* 2. Inserimos os dados exatamente onde eles pertencem */\nINSERT INTO CLIENTES (ID, NOME, SALDO) \nVALUES (1, 'Maria Silva', 1500.00);\n\n/* 3. Fazemos uma pergunta clara ao banco */\nSELECT NOME, SALDO FROM CLIENTES WHERE SALDO > 1000;"},{"type":"p","text":"Por outro lado, bancos NoSQL (como o MongoDB) guardam dados no formato de Documentos, por exemplo, neste caso. A analogia perfeita é uma pasta de papéis flexível. Em uma folha você anotou o nome e o saldo do cliente. Na folha seguinte, você quis anotar o nome, o saldo e o time de futebol da pessoa. A pasta aceita tudo sem exigir que você mude as regras do jogo."},{"type":"p","text":"Veja como é o código moderno e flexível no NoSQL:"},{"type":"pre","text":"/* Você simplesmente joga a informação no banco e ele aceita */\ndb.clientes.insert({\n    \"id\": 1,\n    \"nome\": \"Maria Silva\",\n    \"saldo\": 1500.00,\n    \"time_futebol\": \"Corinthians\"\n})"},{"type":"p","text":"Percebeu que no NoSQL nós inventamos o campo \"time_futebol\" do nada? No DB2, fazer isso exige planejamento, aprovação e uma alteração na estrutura da tabela. A flexibilidade do NoSQL é ótima para aplicativos que mudam o tempo todo, mas a rigidez do DB2 é fundamental quando a informação não pode ter falhas em sistemas críticos."},{"type":"h2","text":"Recommended by LinkedIn"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQE3OVwxZz8xvw/article-cover_image-shrink_720_1280/B4DZ1OPjMAIgAM-/0/1775134193533?e=2147483647&v=beta&t=dBa0-2cesf7qcZnXPdtdWpwZ1Ar8zNmIiktUX5apIaw","alt":"Segmentação de carga com DMS em Oracle","local":"article-inline-7453e8f04d9288d5.jpg"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4E12AQFKwMybHELb3w/article-cover_image-shrink_720_1280/B4EZr_zD.sJ0AI-/0/1765228173690?e=2147483647&v=beta&t=bBJTkPkrpNzDkfW10HTGiIw7yqVtaxL2RbmQfdn_oNY","alt":"Oracle RAC e Oracle Data Guard: Arquitetura, Conceitos, Boas Práticas e Perguntas de Entrevista","local":"article-inline-32bfbb88e8bbb02d.png"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQFaprAWBagSMg/article-cover_image-shrink_720_1280/B4DZyXgJpBHEAI-/0/1772068316155?e=2147483647&v=beta&t=nkI_-hhaJUZhOkTGERHDsQfG6iic6kz5NOr3m9jj1oA","alt":"IA vs. Mainframe: o que a queda histórica da IBM realmente revela","local":"article-inline-049212642dd5a237.jpg"},{"type":"blockquote","text":"O Superpoder do DB2: O padrão ACID"},{"type":"p","text":"Aqui está o termo técnico mais importante que você vai aprender hoje: ACID (Atomicidade, Consistência, Isolamento, Durabilidade)."},{"type":"p","text":"Para entender o ACID, pense no momento exato em que você faz um Pix."},{"type":"p","text":"A Atomicidade significa que a transação é tudo ou nada. O sistema tira 100 reais da sua conta e coloca 100 na conta do seu amigo. Se a internet cair, o servidor reiniciar ou um cabo arrebentar exatamente no milissegundo entre tirar o dinheiro de um e colocar no outro, o DB2 entra em ação. Ele cancela tudo e devolve seu dinheiro."},{"type":"p","text":"Não existe a mínima chance de o valor simplesmente sumir."},{"type":"p","text":"No mundo NoSQL, a regra costuma ser outra, chamada de Consistência Eventual. Pense em quando você atualiza a sua foto de perfil em uma rede social. Por alguns instantes, você já vê a foto nova, mas um amigo em outra cidade ainda vê a foto antiga. Segundos depois, o sistema se sincroniza e todos veem a mesma coisa."},{"type":"p","text":"Para fotos e postagens, essa \"consistência eventual\" é maravilhosa e deixa tudo muito rápido."},{"type":"p","text":"Para o saldo da sua conta bancária, seria uma catástrofe."},{"type":"h3","text":"A Modernização: O Aperto de Mãos"},{"type":"p","text":"O desenvolvedor moderno não precisa ter medo de usar o DB2 porque, hoje em dia, nem sempre alguém precisa acessar a velha tela preta de letras verdes do Mainframe para conversar com ele."},{"type":"p","text":"A modernização trouxe os Serviços REST e APIs, funcionando como um tradutor universal. O programador cria um aplicativo em uma linguagem super nova no celular, o aplicativo envia um arquivo flexível (JSON) pela internet, e a API traduz isso perfeitamente para o DB2 lá no Mainframe. O DB2 processa a compra no cartão com sua segurança inquebrável e devolve a resposta em milissegundos para o celular do cliente."},{"type":"p","text":"Além disso, as versões mais recentes do próprio DB2 foram modernizadas e hoje conseguem ler arquivos no estilo NoSQL (como dados em XML e JSON) diretamente dentro de suas tabelas. Ou seja, ele aprendeu os truques novos sem perder a robustez de sempre."},{"type":"p","text":"Saber falar sobre o DB2 sem medo mostra maturidade. É entender que a inovação não significa jogar fora o que funciona perfeitamente, mas sim conectar a agilidade do mundo moderno com a segurança inabalável do mundo corporativo."},{"type":"p","text":"E, agora, trago algo que explode a cabeça de muitos desenvolvedores modernos."},{"type":"blockquote","text":"Imagine que a transação de compra foi feita no DB2, mas o recibo da compra e as preferências de entrega do cliente têm um formato super complexo que muda o tempo todo, algo que seria perfeito para o formato do NoSQL."},{"type":"p","text":"Adivinhe só? Como falamos, o DB2 moderno possui uma funcionalidade fantástica que permite guardar e pesquisar documentos flexíveis, no formato JSON, nativamente dentro da sua estrutura de cofre. Ele se tornou um sistema híbrido."},{"type":"p","text":"Veja como um programador moderno faz isso na prática, usando a segurança do DB2 e a flexibilidade do mundo NoSQL na mesma tabela:"},{"type":"pre","text":"/* 1. Criando uma tabela no DB2 que aceita colunas rígidas e dados flexíveis */\nCREATE TABLE COMPRAS_BLACKFRIDAY (\n    ID_TRANSACAO INT PRIMARY KEY,\n    VALOR DECIMAL(10,2),\n    DADOS_DO_RECIBO JSON\n);\n\n/* 2. Inserindo o valor com segurança e o recibo com total flexibilidade */\nINSERT INTO COMPRAS_BLACKFRIDAY (ID_TRANSACAO, VALOR, DADOS_DO_RECIBO)\nVALUES (\n    998877, \n    4500.00, \n    '{ \n       \"produto\": \"Smartphone Última Geração\", \n       \"cor\": \"Azul Noturno\", \n       \"entrega\": \"Expressa\",\n       \"presente\": true\n     }'\n);"},{"type":"p","text":"O desenvolvedor pode usar a linguagem tradicional do DB2 para mergulhar dentro desse arquivo flexível e extrair informações específicas, como se estivesse usando um banco NoSQL puro."},{"type":"pre","text":"/* O DB2 extraindo apenas a cor do produto de dentro do documento flexível */\nSELECT \n    ID_TRANSACAO, \n    VALOR,\n    JSON_VAL(DADOS_DO_RECIBO, '$.cor', 's') AS COR_DO_APARELHO\nFROM COMPRAS_BLACKFRIDAY\nWHERE VALOR > 4000;"},{"type":"p","text":"Dessa forma, vimos que mesmo na estrutura cofre do DB2, foi possível modelar um campo com conteúdo JSON para armazenagem e posterior consulta, como faríamos em um banco NoSQL."},{"type":"p","text":"A arquitetura perfeita não é sobre qual tecnologia vence a outra. Ela usa o NoSQL na linha de frente para encantar o cliente com velocidade, e usa o DB2 na retaguarda para processar o dinheiro com a força de um tanque de guerra, inclusive adotando formatos modernos quando necessário."},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQHCaXP_zQb4CA/article-inline_image-shrink_1000_1488/B4DZ_SUqoaHgAM-/0/1785940061067?e=2147483647&v=beta&t=OwN8hhaDOlo7gbqYPjVFNc1h_cGCKovrhTma6dyGV3Y","alt":"Article content","local":"article-inline-b2032035e14614ce.png"},{"type":"p","text":"Abaixo listo dois links que podem lhe ajudar a mergulhar nesse incrível encontro entre o tiozão do pavê com o jovem \"six-seven\":"},{"type":"li","text":"https://www.youtube.com/watch?v=JQ08Jlc8CCw","links":[{"text":"https://www.youtube.com/watch?v=JQ08Jlc8CCw","url":"https://www.youtube.com/watch?v=JQ08Jlc8CCw&trk=article-ssr-frontend-pulse_little-text-block"}]},{"type":"li","text":"https://www.ibm.com/docs/en/db2-for-zos/13.0.0?topic=requirements-nosql-properties","links":[{"text":"https://www.ibm.com/docs/en/db2-for-zos/13.0.0?topic=requirements-nosql-properties","url":"https://www.ibm.com/docs/en/db2-for-zos/13.0.0?topic=requirements-nosql-properties"}]},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQHn-fzGZLz7GQ/article-inline_image-shrink_1500_2232/B4DZ_STXO_GwAY-/0/1785939719651?e=2147483647&v=beta&t=2I4bW9stmShmpmZJ-PzIAVXE8x5dTmEBiToMYrTisqE","alt":"Article content","local":"article-inline-abb4bafd64cc1ef3.png"},{"type":"p","text":"Da próxima vez que o assunto Mainframe ou DB2 surgir na roda de conversas ou no trabalho, você não precisa mais imaginar um dinossauro. Pense nele como as fundações profundas de um arranha-céu moderno. A gente não vê a fundação quando olha para o prédio espelhado, mas é ela que mantém tudo de pé."},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQEnn5RxFjh65g/article-inline_image-shrink_1000_1488/B4DZ_SRe3MI4AI-/0/1785939226295?e=2147483647&v=beta&t=LqxqHTay3IjCzUnsWZGZmk9u5ji8W3Vcrlu7uITF7aM","alt":"Article content","local":"article-inline-4883046084be0c8b.png"}],"retrieved":"2026-10-07"},"5":{"id":5,"title":"Como um computador consegue “entender” sentimentos? A engenharia por trás da NLP","url":"https://www.linkedin.com/pulse/como-um-computador-consegue-entender-sentimentos-por-tr%C3%A1s-vieira-5lphf/","blocks":[{"type":"p","text":"Imagine que você recebeu as seguintes mensagens de clientes:"},{"type":"blockquote","text":"“Esse aplicativo é sensacional. Facilitou completamente a minha vida.”"},{"type":"blockquote","text":"“Estou tentando fazer uma transferência há duas horas e nada funciona.”"},{"type":"blockquote","text":"“Parabéns pelo sistema. Caiu novamente no momento em que eu mais precisava.”"},{"type":"p","text":"Para uma pessoa, parece relativamente simples perceber que a primeira mensagem é positiva, a segunda é negativa e a terceira, apesar da palavra “parabéns”, provavelmente é uma crítica carregada de ironia."},{"type":"p","text":"Mas existe uma pergunta fascinante por trás disso:"},{"type":"h3","text":"Como um computador, que trabalha essencialmente com números, consegue analisar emoções escritas em palavras?"},{"type":"p","text":"Como ele diferencia elogio de reclamação? Como percebe que “incrível” pode ser positivo em uma frase e negativo em outra? Como identifica ironia, raiva, satisfação, medo, urgência ou frustração? É exatamente nesse ponto que entra a NLP, Natural Language Processing, ou, em português, Processamento de Linguagem Natural."},{"type":"p","text":"A NLP é a área da Inteligência Artificial que tenta construir uma ponte entre duas linguagens completamente diferentes:"},{"type":"li","text":"a linguagem humana, cheia de contexto, emoção, ambiguidade e intenção;"},{"type":"li","text":"e a linguagem computacional, baseada em números, estruturas matemáticas e probabilidades."},{"type":"p","text":"Podemos imaginar a NLP como uma espécie de intérprete entre o cérebro humano e a máquina. E, quando falamos de análise de sentimentos, podemos pensar no computador como uma espécie de psicólogo matemático."},{"type":"p","text":"Mas com uma diferença fundamental:"},{"type":"blockquote","text":"O computador não sente a emoção. Ele aprende a reconhecer os padrões deixados por ela na linguagem. Pois até a emoção tem padrão."},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQGL3ccIedixDA/article-inline_image-shrink_1000_1488/B4DZ.OM40FI8AI-/0/1784797172271?e=2147483647&v=beta&t=U7BNBhNxW_iHZB-gbOxFMh1zlTZPQROGt8ZmmFZcZ2I","alt":"Article content","local":"article-inline-15444944b14464fe.png"},{"type":"h2","text":"O computador não entende palavras como nós"},{"type":"p","text":"Quando uma pessoa lê:"},{"type":"blockquote","text":"“Estou extremamente feliz com o resultado.”"},{"type":"p","text":"Ela associa essa frase a experiências, emoções, memórias e conhecimentos construídos ao longo da vida. O computador não possui essa vivência. Para ele, inicialmente, essa frase é apenas uma sequência de caracteres:"},{"type":"pre","text":"E-s-t-o-u  e-x-t-r-e-m-a-m-e-n-t-e  f-e-l-i-z..."},{"type":"p","text":"Antes que qualquer análise seja possível, precisamos transformar palavras em algo que a máquina consiga processar."},{"type":"p","text":"Ou seja:"},{"type":"h3","text":"Precisamos transformar linguagem em números."},{"type":"p","text":"É como tentar explicar uma música para alguém que só entende matemática."},{"type":"p","text":"Você não poderia simplesmente dizer:"},{"type":"blockquote","text":"“Essa música é triste.”"},{"type":"p","text":"Seria necessário converter a música em frequência, intensidade, ritmo, duração, harmonia e outros valores mensuráveis."},{"type":"p","text":"Com a linguagem acontece algo parecido."},{"type":"h2","text":"1. O primeiro passo: quebrar a frase em pequenas partes"},{"type":"p","text":"Considere a frase:"},{"type":"blockquote","text":"“Eu gostei muito desse produto.”"},{"type":"p","text":"Um dos primeiros processos realizados por um sistema de NLP é a tokenização (mesmo processo pelo qual é medido a forma que você usa seu chatGPT). Tokenizar significa dividir o texto em unidades menores chamadas tokens."},{"type":"p","text":"Uma tokenização simples poderia produzir:"},{"type":"pre","text":"[\"Eu\", \"gostei\", \"muito\", \"desse\", \"produto\", \".\"]"},{"type":"p","text":"Mas modelos modernos nem sempre trabalham com palavras completas. Eles podem dividir palavras em partes menores, chamadas subwords."},{"type":"p","text":"Por exemplo:"},{"type":"pre","text":"\"inacreditavelmente\""},{"type":"p","text":"Poderia ser dividida aproximadamente em:"},{"type":"pre","text":"[\"in\", \"acredit\", \"avelmente\"]"},{"type":"p","text":"Isso é útil porque o modelo não precisa conhecer previamente todas as palavras existentes no idioma. Ele pode construir palavras desconhecidas utilizando partes que já aprendeu. É semelhante a uma criança que nunca ouviu a palavra “infelizmente”, mas já conhece:"},{"type":"li","text":"“feliz”;"},{"type":"li","text":"“mente”;"},{"type":"li","text":"e o prefixo “in”, relacionado à negação."},{"type":"p","text":"Ela pode não conhecer completamente a palavra, mas possui peças suficientes para formular uma hipótese sobre seu significado."},{"type":"h2","text":"2. Como transformar palavras em números?"},{"type":"p","text":"Depois de dividir o texto em tokens, precisamos representar cada token matematicamente. Nas primeiras gerações de NLP, uma técnica comum era chamada Bag of Words, ou “saco de palavras”."},{"type":"p","text":"Imagine que temos o seguinte vocabulário:"},{"type":"pre","text":"[\"adorei\", \"produto\", \"odiei\", \"atendimento\"]"},{"type":"p","text":"A frase:"},{"type":"blockquote","text":"“Adorei o produto.”"},{"type":"p","text":"Poderia ser representada por:"},{"type":"pre","text":"[1, 1, 0, 0]"},{"type":"p","text":"Enquanto:"},{"type":"blockquote","text":"“Odiei o atendimento.”"},{"type":"p","text":"Poderia ser representada por:"},{"type":"pre","text":"[0, 0, 1, 1]"},{"type":"p","text":"O número indica se determinada palavra apareceu ou quantas vezes apareceu. É como pegar as palavras, contar, colocar em saquinhos separados e depois ver quantas palavras tem em cada saquinho, sacou?"},{"type":"p","text":"Esse método foi importante para a evolução da NLP, mas possui uma limitação evidente:"},{"type":"h3","text":"Ele praticamente ignora a ordem e o contexto das palavras."},{"type":"p","text":"As frases:"},{"type":"blockquote","text":"“O cachorro mordeu o homem.”"},{"type":"p","text":"e"},{"type":"blockquote","text":"“O homem mordeu o cachorro.”"},{"type":"p","text":"Possuem quase as mesmas palavras. Mas significados completamente diferentes. O “saco de palavras” enxerga os ingredientes, mas não entende a receita."},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQFD5J3RD9iE_Q/article-inline_image-shrink_1000_1488/B4DZ.ONvW2HEAI-/0/1784797395226?e=2147483647&v=beta&t=4-SzocHSsyBwvpGUPwHJz7SOxPo9yUUEOLPs5nUx0ug","alt":"Article content","local":"article-inline-d7d6d3aac13e3627.png"},{"type":"h2","text":"3. Embeddings: criando um mapa matemático da linguagem"},{"type":"p","text":"Modelos mais modernos utilizam estruturas chamadas embeddings. Um embedding é uma representação numérica densa de uma palavra, trecho ou frase."},{"type":"p","text":"Em vez de representar uma palavra com uma sequência enorme de zeros e uns, o sistema a transforma em um vetor com diversos valores numéricos."},{"type":"p","text":"De maneira simplificada:"},{"type":"pre","text":"\"feliz\"   → [0.82, -0.14, 0.61, 0.27, ...]\n\"alegre\"  → [0.79, -0.10, 0.65, 0.31, ...]\n\"triste\"  → [-0.71, 0.44, -0.58, -0.16, ...]"},{"type":"p","text":"Esses números não são escolhidos manualmente. Eles são aprendidos pelo modelo durante o treinamento. Palavras utilizadas em contextos semelhantes acabam ocupando regiões próximas nesse espaço matemático."},{"type":"p","text":"Podemos imaginar isso como um enorme mapa."},{"type":"p","text":"Nesse mapa:"},{"type":"li","text":"“feliz” fica próximo de “alegre”;"},{"type":"li","text":"“carro” fica próximo de “veículo”;"},{"type":"li","text":"“médico” fica próximo de “hospital”;"},{"type":"li","text":"“erro” pode ficar próximo de “falha”;"},{"type":"li","text":"“péssimo” tende a ficar distante de “excelente”."},{"type":"p","text":"É como se cada conceito recebesse coordenadas em um universo de significados."},{"type":"p","text":"Esse universo não possui apenas duas ou três dimensões e um embedding moderno pode possuir centenas ou milhares de dimensões, sendo que cada dimensão ajuda o modelo a capturar determinados padrões semânticos."},{"type":"p","text":"Não devemos imaginar que uma dimensão representa exatamente “felicidade” e outra representa “raiva”. A representação é distribuída: o significado emerge da combinação de muitos valores."},{"type":"h2","text":"4. O contexto muda tudo"},{"type":"p","text":"Considere a palavra:"},{"type":"blockquote","text":"“banco”"},{"type":"p","text":"Ela pode representar:"},{"type":"li","text":"uma instituição financeira;"},{"type":"li","text":"um assento;"},{"type":"li","text":"um banco de dados;"},{"type":"li","text":"um banco de areia;"},{"type":"li","text":"uma reserva de recursos."},{"type":"p","text":"Como o computador descobre qual significado está sendo utilizado?"},{"type":"p","text":"Pelo contexto."},{"type":"p","text":"Observe:"},{"type":"blockquote","text":"“O banco aprovou meu financiamento.”"},{"type":"blockquote","text":"“Sentei no banco da praça.”"},{"type":"blockquote","text":"“Precisamos consultar o banco de dados.”"},{"type":"p","text":"A palavra é a mesma, mas as palavras ao redor alteram completamente o significado. Modelos antigos frequentemente atribuíam uma única representação para cada palavra. Modelos modernos conseguem produzir embeddings contextuais."},{"type":"p","text":"Isso significa que a representação matemática da palavra “banco” será diferente em cada uma dessas frases. O significado deixa de estar somente na palavra e ele passa a estar na relação entre as palavras."},{"type":"h2","text":"Transformers: o momento em que o computador aprende onde prestar atenção"},{"type":"p","text":"Grande parte dos modelos modernos de NLP é baseada em uma arquitetura chamada Transformer. O coração dessa arquitetura é um mecanismo chamado Attention, ou atenção. A ideia pode ser entendida com uma analogia."},{"type":"li","text":"Imagine uma sala cheia de pessoas conversando."},{"type":"li","text":"Você ouve diversas vozes ao mesmo tempo, mas seu cérebro consegue dar mais importância à voz da pessoa com quem está falando."},{"type":"li","text":"Você não ignora completamente o restante do ambiente, mas distribui sua atenção de maneira diferente."},{"type":"li","text":"O mecanismo de atenção faz algo semelhante com as palavras de uma frase."},{"type":"p","text":"Considere:"},{"type":"blockquote","text":"“O aplicativo estava ótimo antes da atualização, mas agora está horrível.”"},{"type":"p","text":"Para determinar o sentimento geral, o modelo precisa perceber algumas coisas:"},{"type":"li","text":"“ótimo” expressa um sentimento positivo;"},{"type":"li","text":"“antes” posiciona esse sentimento no passado;"},{"type":"li","text":"“mas” indica uma mudança de direção;"},{"type":"li","text":"“agora” direciona a avaliação para o presente;"},{"type":"li","text":"“horrível” é o sinal mais relevante para o sentimento atual."},{"type":"p","text":"A palavra “mas” possui um papel importantíssimo. Ela informa ao modelo que a segunda parte da frase provavelmente deve receber mais peso. O mecanismo de atenção calcula relações entre os tokens e tenta responder:"},{"type":"blockquote","text":"Para entender esta palavra, em quais outras palavras eu deveria prestar mais atenção?"},{"type":"p","text":"Tecnicamente, cada token é transformado em três representações principais:"},{"type":"li","text":"Query: o que esse token está procurando;"},{"type":"li","text":"Key: o que esse token pode oferecer;"},{"type":"li","text":"Value: a informação carregada pelo token."},{"type":"p","text":"A atenção é calculada, de forma resumida, por uma operação semelhante a:"},{"type":"h2","text":"Recommended by LinkedIn"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQFo4cIwx4iOHQ/article-cover_image-shrink_720_1280/article-cover_image-shrink_720_1280/0/1673392931705?e=2147483647&v=beta&t=L9MPmz9ITHuLfcS9Yj4g1febm9USf2hQ6kpTwpU50iI","alt":"Um papo sobre Chat GPT e Machine Learning","local":"article-inline-237b632b97d2f05f.png"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQG4PpCWcyccWA/article-cover_image-shrink_720_1280/article-cover_image-shrink_720_1280/0/1683910361698?e=2147483647&v=beta&t=GZeKx5QEFgm2Hi4Je3YoRSbXqilK7sButpF8bemAUSA","alt":"Entendendo os Transformers (o \"T\" do ChatGPT)","local":"article-inline-697b6820883700b7.png"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4E12AQGiY75vJwSDhQ/article-cover_image-shrink_720_1280/B4EZtMJguRIMAI-/0/1766509121976?e=2147483647&v=beta&t=1HVzVCihxFTBRUtcV29SmagYh7-hKxARCE1G90n_tW8","alt":"Significado como uso: Wittgenstein explica embeddings melhor do que parece","local":"article-inline-eacbff392ac78e52.png"},{"type":"pre","text":"Attention(Q, K, V) = softmax(QKᵀ / √d) · V"},{"type":"p","text":"Apesar da aparência matemática, a ideia é intuitiva:"},{"type":"li","text":"o modelo compara cada palavra com as demais;"},{"type":"li","text":"calcula quais relações são mais relevantes;"},{"type":"li","text":"transforma essas relações em pesos;"},{"type":"li","text":"combina as informações dando mais importância ao que realmente importa."},{"type":"p","text":"O resultado é uma representação contextualizada da frase."},{"type":"h2","text":"Tá, mas como o computador aprende o que é positivo ou negativo?"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQFaHiekskERDA/article-inline_image-shrink_1000_1488/B4DZ.OQD3WGkAI-/0/1784798003584?e=2147483647&v=beta&t=InHiHepwEeTwgPcTtYz6oRXKp-pckQyJ2i_I45TjVEo","alt":"Article content","local":"article-inline-1d4f44863483c9c7.png"},{"type":"p","text":"Para ensinar análise de sentimentos, precisamos fornecer exemplos. Imagine um conjunto de dados como este:"},{"type":"pre","text":"“Adorei o atendimento.”                 → POSITIVO\n“O produto chegou quebrado.”            → NEGATIVO\n“Funcionou como esperado.”              → NEUTRO\n“Não consigo acessar minha conta.”      → NEGATIVO\n“Excelente experiência de compra.”      → POSITIVO"},{"type":"p","text":"Durante o treinamento, o modelo recebe uma frase, realiza uma previsão e compara o resultado com a resposta correta."},{"type":"p","text":"Exemplo:"},{"type":"pre","text":"Frase: “O produto chegou quebrado.”\n\nPrevisão inicial do modelo:\nPositivo: 60%\nNegativo: 30%\nNeutro: 10%\n\nResposta correta:\nNegativo"},{"type":"p","text":"O modelo errou. Esse erro é medido por uma função de perda, também chamada de loss function. Em seguida, algoritmos de otimização, como o gradient descent, ajustam milhões ou bilhões de parâmetros internos para reduzir a chance de o mesmo erro acontecer novamente."},{"type":"p","text":"Podemos imaginar o treinamento como um professor corrigindo repetidamente um aluno:"},{"type":"blockquote","text":"“Você classificou essa frase como positiva, mas ela era negativa. Ajuste sua forma de observar as palavras.”"},{"type":"p","text":"Depois de milhares ou milhões de exemplos, o modelo começa a reconhecer padrões. Ele percebe que expressões como:"},{"type":"li","text":"“adorei”;"},{"type":"li","text":"“excelente”;"},{"type":"li","text":"“recomendo”;"},{"type":"li","text":"“superou minhas expectativas”;"},{"type":"p","text":"aparecem frequentemente em avaliações positivas."},{"type":"p","text":"Também percebe que:"},{"type":"li","text":"“não funciona”;"},{"type":"li","text":"“péssimo”;"},{"type":"li","text":"“decepcionado”;"},{"type":"li","text":"“quero cancelar”;"},{"type":"p","text":"aparecem frequentemente em avaliações negativas."},{"type":"p","text":"Mas os modelos mais avançados vão além da contagem de palavra, eles aprendem combinações, construções linguísticas, contexto e relações semânticas."},{"type":"h2","text":"O momento final: transformando a frase em probabilidades"},{"type":"p","text":"Depois de processar a frase, e aprofundar em seu modelo tudo isso dito anteriormente, o modelo produz uma representação numérica consolidada."},{"type":"p","text":"Essa representação pode ser enviada para uma camada de classificação."},{"type":"p","text":"Simplificadamente:"},{"type":"pre","text":"logits = W · h + b"},{"type":"p","text":"Onde:"},{"type":"li","text":"h representa a compreensão matemática construída para o texto;"},{"type":"li","text":"W representa pesos aprendidos;"},{"type":"li","text":"b representa um ajuste chamado bias;"},{"type":"li","text":"logits são valores ainda não normalizados para cada classe."},{"type":"p","text":"Em seguida, uma função chamada softmax (um tipo de função que transforma as variáveis em formas classificatórias) transforma esses valores em probabilidades."},{"type":"p","text":"Por exemplo:"},{"type":"pre","text":"Positivo:  0,03\nNeutro:    0,07\nNegativo:  0,90"},{"type":"p","text":"O sistema poderia então retornar:"},{"type":"blockquote","text":"Sentimento predominante: negativo Confiança estimada: 90%"},{"type":"p","text":"É importante perceber que o modelo não está afirmando uma verdade absoluta, ele está fazendo uma inferência probabilística com base nos padrões que aprendeu."},{"type":"h2","text":"O computador virou psicólogo?"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQHbT04RE9cl3Q/article-inline_image-shrink_1000_1488/B4DZ.OPpgVHEAI-/0/1784797894917?e=2147483647&v=beta&t=32Hvch6CFXlpesRCoi3yOFjkAmyTrCDNdA_IXUp-rrQ","alt":"Article content","local":"article-inline-6be27f3653c13a4d.png"},{"type":"p","text":"Não exatamente."},{"type":"blockquote","text":"Um psicólogo humano compreende experiências dentro de uma história de vida, observa pausas, comportamento, tom de voz, contexto social, contradições, traumas, vínculos e muitos outros sinais."},{"type":"p","text":"Um modelo de análise de sentimentos observa padrões linguísticos, somente."},{"type":"p","text":"Ele não sente tristeza, ele reconhece que determinadas estruturas são frequentemente associadas à tristeza."},{"type":"p","text":"Ele não sente raiva, ele identifica que certas palavras, construções e contextos possuem alta correlação com mensagens classificadas como raivosas."},{"type":"p","text":"Portanto, uma definição mais precisa seria:"},{"type":"blockquote","text":"O computador não possui sentimentos. Ele calcula a probabilidade de um texto representar determinados sentimentos, o que não necessariamente é afirmar um sentimento, mas sim encontrar padrões deles."},{"type":"p","text":"Ainda assim, essa capacidade pode ser extremamente poderosa para o entendimento do sentimento de algum público ou de clientes de uma empresa e como se sentem em relação a algo para melhorar a tomada de decisão durante o dia a dia."},{"type":"h2","text":"Emojis também possuem linguagem"},{"type":"p","text":"Considere:"},{"type":"blockquote","text":"“O aplicativo caiu de novo 😂”"},{"type":"p","text":"O emoji de risada pode indicar diversão. Mas também pode representar ironia, incredulidade ou frustração."},{"type":"p","text":"Agora compare:"},{"type":"blockquote","text":"“Consegui a promoção 😂”"},{"type":"blockquote","text":"“Fui bloqueado novamente 😂”"},{"type":"p","text":"O mesmo emoji participa de emoções diferentes dependendo do contexto. Em ambientes digitais, sinais como estes também possuem valor:"},{"type":"li","text":"repetição de letras: “ameeeeei”;"},{"type":"li","text":"uso de caixa alta: “NÃO FUNCIONA”;"},{"type":"li","text":"excesso de pontuação: “SÉRIO????”;"},{"type":"li","text":"emojis;"},{"type":"li","text":"hashtags;"},{"type":"li","text":"abreviações;"},{"type":"li","text":"palavras ofensivas;"},{"type":"li","text":"tempo e sequência das mensagens."},{"type":"p","text":"Tudo isso pode ser transformado em informação para o modelo."},{"type":"h2","text":"O modelo precisa ser avaliado corretamente"},{"type":"p","text":"Não basta treinar um modelo e observar quantas classificações ele acertou. Imagine um conjunto com:"},{"type":"li","text":"90% de mensagens neutras;"},{"type":"li","text":"5% positivas;"},{"type":"li","text":"5% negativas."},{"type":"p","text":"Um modelo que sempre respondesse “neutro” teria 90% de acurácia. Mesmo assim, seria praticamente inútil. Por isso, utilizamos métricas como:"},{"type":"h3","text":"Precision"},{"type":"p","text":"Entre todas as mensagens classificadas como negativas, quantas realmente eram negativas?"},{"type":"h3","text":"Recall"},{"type":"p","text":"Entre todas as mensagens realmente negativas, quantas o modelo conseguiu encontrar?"},{"type":"h3","text":"F1-score"},{"type":"p","text":"Uma combinação entre precision e recall."},{"type":"h3","text":"Matriz de confusão"},{"type":"p","text":"Mostra quais classes estão sendo confundidas."},{"type":"p","text":"Por exemplo:"},{"type":"pre","text":"Predito\nReal          Positivo  Neutro  Negativo\n\nPositivo         850      90       60\nNeutro           110     720      170\nNegativo          40     130      830"},{"type":"p","text":"Esse tipo de análise permite descobrir, por exemplo, que o modelo está confundindo mensagens neutras com negativas. Em determinados contextos, errar uma classe pode ser mais grave do que errar outra. Para um sistema de suporte, deixar de identificar uma reclamação crítica pode ser mais prejudicial do que classificar uma mensagem neutra como reclamação."},{"type":"h2","text":"O desafio dos vieses"},{"type":"p","text":"Um modelo aprende com os dados que recebe. Se os dados possuem distorções, preconceitos ou representações inadequadas, o modelo pode reproduzir esses problemas."},{"type":"p","text":"Considere diferenças de linguagem entre:"},{"type":"li","text":"regiões;"},{"type":"li","text":"faixas etárias;"},{"type":"li","text":"grupos sociais;"},{"type":"li","text":"contextos culturais;"},{"type":"li","text":"comunidades profissionais."},{"type":"p","text":"Uma expressão pode ser ofensiva em determinado contexto e carinhosa em outro. Um modelo treinado majoritariamente com textos formais pode interpretar incorretamente gírias, dialetos ou modos informais de comunicação."},{"type":"p","text":"Por isso, um projeto responsável de NLP precisa avaliar:"},{"type":"li","text":"representatividade dos dados;"},{"type":"li","text":"equilíbrio entre as classes;"},{"type":"li","text":"desempenho por grupos e contextos;"},{"type":"li","text":"presença de linguagem discriminatória;"},{"type":"li","text":"privacidade;"},{"type":"li","text":"finalidade de uso;"},{"type":"li","text":"impacto dos erros;"},{"type":"li","text":"necessidade de supervisão humana."},{"type":"p","text":"Quanto maior o impacto da decisão, maior deve ser o cuidado. Uma classificação utilizada para organizar avaliações de produtos possui um risco diferente de uma classificação utilizada em saúde, crédito, contratação ou segurança."},{"type":"h2","text":"O verdadeiro poder da NLP"},{"type":"p","text":"A análise de sentimentos é apenas uma das possibilidades."},{"type":"p","text":"A NLP também pode ser utilizada para:"},{"type":"li","text":"resumir documentos;"},{"type":"li","text":"responder perguntas;"},{"type":"li","text":"classificar chamados;"},{"type":"li","text":"extrair nomes, datas e valores;"},{"type":"li","text":"detectar intenção;"},{"type":"li","text":"traduzir idiomas;"},{"type":"li","text":"identificar tópicos;"},{"type":"li","text":"encontrar documentos semelhantes;"},{"type":"li","text":"gerar textos;"},{"type":"li","text":"analisar contratos;"},{"type":"li","text":"criar assistentes virtuais;"},{"type":"li","text":"organizar bases de conhecimento;"},{"type":"li","text":"detectar discurso abusivo;"},{"type":"li","text":"transformar linguagem natural em consultas ou código."},{"type":"p","text":"Em todos esses casos, existe a mesma ideia central:"},{"type":"blockquote","text":"Transformar linguagem humana em uma representação que o computador consiga processar e utilizar."},{"type":"h2","text":"Afinal, a máquina entende o que sentimos?"},{"type":"p","text":"Essa pergunta depende do que chamamos de “entender”."},{"type":"p","text":"Se entender significa:"},{"type":"li","text":"possuir consciência;"},{"type":"li","text":"sentir emoções;"},{"type":"li","text":"ter experiências;"},{"type":"li","text":"compreender a existência como um ser humano;"},{"type":"h2","text":"então não."},{"type":"p","text":"Mas se entender significa:"},{"type":"li","text":"identificar padrões;"},{"type":"li","text":"relacionar conceitos;"},{"type":"li","text":"interpretar contexto;"},{"type":"li","text":"estimar intenção;"},{"type":"li","text":"reconhecer sinais linguísticos;"},{"type":"li","text":"produzir uma resposta coerente;"},{"type":"p","text":"então os modelos atuais conseguem realizar uma forma extremamente sofisticada de interpretação computacional."},{"type":"p","text":"Não é uma compreensão humana. É uma compreensão estatística, matemática e contextual."},{"type":"p","text":"O computador não fica triste ao ler:"},{"type":"blockquote","text":"“Perdi alguém importante.”"},{"type":"p","text":"Mas consegue reconhecer que palavras, relações e construções presentes nessa frase aparecem frequentemente em contextos de perda e tristeza. Ele não vive a emoção, mas reconhece sua assinatura linguística."},{"type":"p","text":"No meio dessa realidade, temos uma das tecnologias mais poderosas do nosso tempo:"},{"type":"h3","text":"a capacidade de fazer uma máquina observar a linguagem humana e encontrar significado dentro dela para melhor nos entendermos, mas não para substituir nossos sentimentos humanos."}],"retrieved":"2026-10-07"},"6":{"id":6,"title":"Javeiro pode criar agentes de IA? MCP, LLMs, LangChain, LangChain4j e métricas para criar agentes performáticos com Java","url":"https://www.linkedin.com/pulse/javeiro-pode-criar-agentes-de-ia-mcp-llms-langchain-e-wesley-vieira-uaocf/","blocks":[{"type":"p","text":"Se você vem do Java, provavelmente já está acostumado com arquitetura, APIs, services, repositories, mensageria, logs, métricas, testes e deploy. A boa notícia é: IA generativa e agentes não substituem esse conhecimento, eles aumentam o valor dele."},{"type":"p","text":"Um bom engenheiro Java já pensa em contrato, observabilidade, resiliência, latência, segurança, custo e manutenção. E é exatamente isso que diferencia um “chatbot bonitinho” de um agente de IA confiável em produção."},{"type":"p","text":"A ideia deste artigo é te levar do zero ao avançado, explicando de forma fácil o que é:"},{"type":"p","text":"LLM, prompt, RAG, embeddings, agents, tools, MCP, LangChain, LangChain4j, métricas, avaliação, segurança e performance."},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQFpLw2YmEMXcg/article-inline_image-shrink_400_744/B4DZ5mdWgcIMAQ-/0/1779835431296?e=2147483647&v=beta&t=WKJF7O2ZmyNwbS1FNfmfW2FcMEUw5l-NM6lBE9LV7Vc","alt":"Article content","local":"article-inline-1624d4f71ec5724d.gif"},{"type":"h3","text":"1. Primeiro: o que é um LLM?"},{"type":"p","text":"LLM significa Large Language Model, ou grande modelo de linguagem."},{"type":"p","text":"Pense nele como um “motor de raciocínio probabilístico” treinado em muito texto, código e conhecimento geral. Ele recebe uma entrada, chamada de prompt, e gera uma saída em linguagem natural, código, JSON, explicação, plano, resumo ou decisão."},{"type":"p","text":"Exemplos de LLMs:"},{"type":"li","text":"GPT"},{"type":"li","text":"Claude"},{"type":"li","text":"Gemini"},{"type":"li","text":"Llama"},{"type":"li","text":"Mistral"},{"type":"p","text":"Para um dev Java, o LLM pode ser visto como um serviço externo inteligente:"},{"type":"pre","text":"Minha aplicação Java -> envia contexto/pergunta -> LLM -> recebe resposta"},{"type":"p","text":"Mas existe um detalhe importante: o LLM sozinho não sabe tudo sobre o seu sistema."},{"type":"p","text":"Ele não sabe automaticamente:"},{"type":"li","text":"seus dados internos;"},{"type":"li","text":"seus contratos;"},{"type":"li","text":"suas regras de negócio;"},{"type":"li","text":"seu banco de dados;"},{"type":"li","text":"seus logs;"},{"type":"li","text":"suas APIs;"},{"type":"li","text":"seus documentos privados;"},{"type":"li","text":"seu fluxo operacional."},{"type":"p","text":"Para isso, você precisa dar contexto."},{"type":"p","text":"É aí que entram RAG, tools, agents e MCP."},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQF3A2tLX769iA/article-inline_image-shrink_1000_1488/B4DZ5md7IvG4AI-/0/1779835581265?e=2147483647&v=beta&t=34PCrMqh0mF4q0AGajTCj0E2hMi9CV24vUK5MiJ6xeM","alt":"Article content","local":"article-inline-cb262591de0cb1a5.gif"},{"type":"h3","text":"2. Prompt não é só “perguntar bonito”"},{"type":"p","text":"Prompt é a instrução enviada ao modelo."},{"type":"p","text":"☹️ Um prompt ruim diz:"},{"type":"blockquote","text":"Analise esse cliente."},{"type":"p","text":"😁 Um prompt bom diz:"},{"type":"blockquote","text":"Você é um assistente de análise de crédito. Use apenas os dados fornecidos. Explique o risco em até 5 bullets. Retorne também um JSON com score, motivo e recomendação. Não invente dados ausentes."},{"type":"p","text":"Para Java developers, prompt deve ser tratado quase como contrato de API."},{"type":"p","text":"Ele precisa ter:"},{"type":"li","text":"papel do modelo;"},{"type":"li","text":"objetivo;"},{"type":"li","text":"contexto;"},{"type":"li","text":"restrições;"},{"type":"li","text":"formato de resposta;"},{"type":"li","text":"exemplos;"},{"type":"li","text":"regras de erro;"},{"type":"li","text":"o que fazer quando não souber."},{"type":"p","text":"Exemplo:"},{"type":"pre","text":"Você é um agente especialista em suporte técnico.\n\nContexto:\n{documentos_recuperados}\n\nPergunta do usuário:\n{pergunta}\n\nRegras:\n- Responda somente com base no contexto.\n- Se não encontrar a resposta, diga que não encontrou.\n- Não invente endpoints, nomes de tabelas ou regras.\n- Retorne em português claro."},{"type":"p","text":"Essa mentalidade é muito parecida com criar uma interface Java bem definida."},{"type":"h3","text":"3. O que é RAG?"},{"type":"p","text":"RAG significa Retrieval-Augmented Generation."},{"type":"p","text":"Em português simples: antes de o LLM responder, sua aplicação busca informações relevantes em documentos, banco, arquivos, páginas, políticas ou base de conhecimento. Depois, manda esse contexto para o modelo responder melhor."},{"type":"p","text":"Fluxo:"},{"type":"pre","text":"Usuário pergunta\n      ↓\nSistema busca documentos relevantes\n      ↓\nSistema envia pergunta + contexto ao LLM\n      ↓\nLLM responde baseado no contexto"},{"type":"p","text":"Exemplo prático:"},{"type":"p","text":"Usuário pergunta:"},{"type":"blockquote","text":"Qual é a política de reembolso da empresa?"},{"type":"p","text":"O sistema faz:"},{"type":"pre","text":"1. Busca nos documentos internos.\n2. Recupera os trechos relevantes.\n3. Envia esses trechos para o LLM.\n4. O LLM responde com base neles."},{"type":"p","text":"Sem RAG, o modelo pode inventar."},{"type":"p","text":"Com RAG, ele responde com base em informação real, CONTEXTUALIZADO."},{"type":"h3","text":"4. O que são embeddings?"},{"type":"p","text":"Embedding é uma forma de transformar texto em vetor numérico."},{"type":"p","text":"Exemplo:"},{"type":"pre","text":"\"cancelamento de cartão\" -> [0.12, -0.45, 0.88, ...]\n\"bloqueio de cartão\"     -> [0.10, -0.40, 0.83, ...]\n\"receita de bolo\"        -> [-0.91, 0.22, 0.05, ...]"},{"type":"p","text":"Textos parecidos ficam próximos no espaço vetorial."},{"type":"p","text":"Isso permite busca semântica."},{"type":"p","text":"Ou seja, o usuário pode perguntar:"},{"type":"blockquote","text":"Como faço para parar meu cartão?"},{"type":"p","text":"E o sistema encontra documentos sobre:"},{"type":"pre","text":"cancelamento de cartão\nbloqueio de cartão\nencerramento de cartão"},{"type":"p","text":"Mesmo que as palavras não sejam exatamente iguais."},{"type":"p","text":"Mas aí, entra um ponto importante: pode-se ter agentes bem estruturados, criados e provisionados, porém sem contextos, dados e informações bem utilizadas, a manutenção e a assertividade dos agentes pode se tornar um verdadeiro problema."},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQE8w3IF-DuwEg/article-inline_image-shrink_400_744/B4DZ5mf.3iHMAM-/0/1779836121254?e=2147483647&v=beta&t=Icovy8q9JwOB6rQMIsIYP8ezuCqxH9qpB7Ey7addywM","alt":"Article content","local":"article-inline-ee7fba9773e7c768.gif"},{"type":"h3","text":"5. O que é LangChain?"},{"type":"p","text":"LangChain é um framework para criar aplicações com LLMs, agentes, chains, tools e RAG. A própria LangChain se posiciona hoje como uma plataforma/framework para construir agentes e aplicações com LLMs, conectando componentes e integrações de forma mais simples."},{"type":"p","text":"A ideia é ajudar você a montar fluxos como:"},{"type":"pre","text":"Prompt -> LLM -> Parser -> Tool -> Memória -> Resposta"},{"type":"p","text":"ou, de forma mais simplista:"},{"type":"pre","text":"Pergunta -> Retriever -> Documentos -> LLM -> Resposta"},{"type":"p","text":"A IBM resume LangChain como um framework de orquestração open source para desenvolver aplicações com LLMs, como chatbots e agentes."},{"type":"p","text":"(fonte: https://www.ibm.com/br-pt/think/topics/langchain?utm_source=chatgpt.com)","links":[{"text":"https://www.ibm.com/br-pt/think/topics/langchain?utm_source=chatgpt.com","url":"https://www.ibm.com/br-pt/think/topics/langchain?utm_source=chatgpt.com&trk=article-ssr-frontend-pulse_little-text-block"}]},{"type":"p","text":"Mas aqui existe um ponto importante para quem é Java:"},{"type":"p","text":"LangChain nasceu muito forte em Python e JavaScript. Para Java, o equivalente mais natural é o LangChain4j. Aliás, o uso de Machine Learning e questões relacionadas a IA e dados são mais comuns em Python, mas nada impede que o nosso tão velho e poderoso Java também possa ser útil nesta tarefa."},{"type":"h3","text":"6. LangChain4j: o caminho natural para Java"},{"type":"p","text":"Para quem programa em Java, LangChain4j é uma das opções mais interessantes."},{"type":"p","text":"Ele leva conceitos do ecossistema LangChain para Java:"},{"type":"li","text":"conexão com modelos;"},{"type":"li","text":"chat memory;"},{"type":"li","text":"RAG;"},{"type":"li","text":"tools;"},{"type":"li","text":"agentes;"},{"type":"li","text":"integração com provedores de LLM;"},{"type":"li","text":"integração com MCP;"},{"type":"li","text":"uso com frameworks como Quarkus e Spring."},{"type":"p","text":"A documentação do LangChain4j já traz suporte ao Model Context Protocol, permitindo comunicação com servidores MCP que fornecem e executam ferramentas."},{"type":"p","text":"Exemplo mental:"},{"type":"pre","text":"interface Assistant {\n    String chat(String message);\n}"},{"type":"p","text":"Você define uma interface, configura o modelo, adiciona ferramentas e deixa a aplicação conversar com o LLM."},{"type":"p","text":"Para um dev Java, isso é poderoso porque aproxima IA do jeito que você já pensa:"},{"type":"pre","text":"Interface -> Implementação -> Configuração -> Injeção -> Observabilidade"},{"type":"h3","text":"7. O que é um Agent?"},{"type":"p","text":"Um agent é um sistema que usa um LLM para decidir ações."},{"type":"p","text":"Um chatbot simples apenas responde."},{"type":"p","text":"Um agente pode:"},{"type":"li","text":"analisar a pergunta;"},{"type":"li","text":"escolher uma ferramenta;"},{"type":"li","text":"chamar uma API;"},{"type":"li","text":"consultar banco;"},{"type":"li","text":"buscar documento;"},{"type":"li","text":"validar resposta;"},{"type":"li","text":"executar uma ação;"},{"type":"li","text":"explicar o resultado."},{"type":"p","text":"Exemplo:"},{"type":"pre","text":"Usuário: \"Qual foi o status do pedido 123?\"\n\nAgente:\n1. Entende que precisa consultar pedido.\n2. Chama a tool buscarPedido(123).\n3. Recebe os dados.\n4. Resume a resposta.\n5. Retorna ao usuário."},{"type":"p","text":"Em termos Java:"},{"type":"li","text":"LLM = cérebro linguístico"},{"type":"li","text":"Tools = services/actions disponíveis"},{"type":"li","text":"Agent = orquestrador que decide quando usar cada service"},{"type":"h3","text":"8. O que são Tools?"},{"type":"p","text":"Tools são funções que o agente pode chamar."},{"type":"p","text":"Por exemplo:"},{"type":"pre","text":"public class PedidoTools {\n\n    @Tool(\"Busca um pedido pelo ID\")\n    public Pedido buscarPedido(String pedidoId) {\n        return pedidoService.buscarPorId(pedidoId);\n    }\n\n    @Tool(\"Cancela um pedido se ainda estiver pendente\")\n    public CancelamentoResponse cancelarPedido(String pedidoId) {\n        return pedidoService.cancelar(pedidoId);\n    }\n}"},{"type":"p","text":"O LLM não acessa diretamente seu banco."},{"type":"p","text":"Ele pede para usar uma ferramenta."},{"type":"p","text":"A aplicação decide se permite."},{"type":"p","text":"Isso é fundamental para segurança."},{"type":"p","text":"Nunca pense:"},{"type":"blockquote","text":"LLM pode fazer tudo."},{"type":"p","text":"Pense!!!!"},{"type":"blockquote","text":"LLM só pode pedir ações controladas pela minha aplicação."},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQFFsYcpBuCf6Q/article-inline_image-shrink_1000_1488/B4DZ5miEe4KEAI-/0/1779836668210?e=2147483647&v=beta&t=VSuNRBAYB0jbqMIJW_4qezJ2P1_cSBoJliuqhxQPL0E","alt":"Article content","local":"article-inline-987c1d7304aabb06.gif"},{"type":"h3","text":"9. O que é MCP?"},{"type":"p","text":"MCP significa Model Context Protocol."},{"type":"p","text":"É um protocolo para padronizar como aplicações de IA se conectam a ferramentas, dados e sistemas externos. Como gRPC ou HTTP também são protocolos para comunicação de APIs, pense no MCP como um protocolo para comunicação com LLMs."},{"type":"p","text":"Uma analogia boa:"},{"type":"pre","text":"MCP é como um USB-C para agentes de IA."},{"type":"p","text":"Em vez de cada app criar uma integração específica com GitHub, Slack, banco, arquivos, Jira, CRM ou sistema interno, você pode expor esses recursos através de servidores MCP."},{"type":"p","text":"A documentação do LangChain4j diz que ele suporta MCP para se comunicar com servidores compatíveis que fornecem e executam ferramentas."},{"type":"p","text":"(fonte: https://github.com/langchain4j/langchain4j/blob/main/docs/docs/tutorials/mcp.md?utm_source=chatgpt.com)","links":[{"text":"https://github.com/langchain4j/langchain4j/blob/main/docs/docs/tutorials/mcp.md?utm_source=chatgpt.com","url":"https://github.com/langchain4j/langchain4j/blob/main/docs/docs/tutorials/mcp.md?utm_source=chatgpt.com&trk=article-ssr-frontend-pulse_little-text-block"}]},{"type":"p","text":"O Quarkus LangChain4j também descreve MCP como uma integração que permite descobrir tools em runtime, executar operações em sistemas externos por protocolos padronizados e acessar recursos como arquivos, bancos e APIs por servidores MCP."},{"type":"p","text":"(fonte: https://docs.quarkiverse.io/quarkus-langchain4j/dev/mcp.html?utm_source=chatgpt.com)","links":[{"text":"https://docs.quarkiverse.io/quarkus-langchain4j/dev/mcp.html?utm_source=chatgpt.com","url":"https://docs.quarkiverse.io/quarkus-langchain4j/dev/mcp.html?utm_source=chatgpt.com&trk=article-ssr-frontend-pulse_little-text-block"}]},{"type":"p","text":"Fluxo simples:"},{"type":"pre","text":"Agente Java\n   ↓\nMCP Client\n   ↓\nMCP Server\n   ↓\nFerramentas externas: GitHub, banco, arquivos, APIs, CRM"},{"type":"h3","text":"10. MCP não é mágica: cuidado com segurança"},{"type":"p","text":"MCP é poderoso, mas também aumenta a superfície de ataque."},{"type":"p","text":"Quando você permite que um agente acesse ferramentas externas, você precisa pensar em:"},{"type":"li","text":"autenticação;"},{"type":"li","text":"autorização;"},{"type":"li","text":"escopo mínimo;"},{"type":"li","text":"logs;"},{"type":"li","text":"rate limit;"},{"type":"li","text":"sandbox;"},{"type":"li","text":"validação de parâmetros;"},{"type":"li","text":"proteção contra prompt injection;"},{"type":"li","text":"aprovação humana para ações críticas."},{"type":"p","text":"Recentemente, pesquisas de segurança apontaram riscos relevantes em implementações e uso de MCP, especialmente envolvendo execução remota, prompt injection, supply chain e servidores expostos."},{"type":"p","text":"Então a regra é:"},{"type":"blockquote","text":"MCP deve ser tratado como integração crítica de produção, não como brinquedo."},{"type":"p","text":"Para ações perigosas, como deletar dados, transferir dinheiro, alterar permissões ou enviar mensagens oficiais, use:"},{"type":"blockquote","text":"Human-in-the-loop"},{"type":"p","text":"Ou seja: o agente sugere, mas o humano aprova."},{"type":"h3","text":"11. O que é um agente performático?"},{"type":"p","text":"Um agente performático não é só aquele que “responde bonito”."},{"type":"p","text":"É aquele que:"},{"type":"li","text":"responde certo;"},{"type":"li","text":"responde rápido;"},{"type":"li","text":"custa pouco;"},{"type":"li","text":"não inventa;"},{"type":"li","text":"chama poucas tools;"},{"type":"li","text":"sabe quando não sabe;"},{"type":"li","text":"tem logs;"},{"type":"li","text":"é testável;"},{"type":"li","text":"é seguro;"},{"type":"li","text":"pode ser monitorado;"},{"type":"li","text":"melhora com avaliação contínua."},{"type":"p","text":"☹️ Um agente ruim faz isso:"},{"type":"pre","text":"Usuário pergunta algo simples.\nAgente chama 10 ferramentas.\nGasta muitos tokens.\nDemora 20 segundos.\nRetorna uma resposta inventada."},{"type":"p","text":"😁 Um agente bom faz isso:"},{"type":"pre","text":"Classifica a intenção.\nBusca só o necessário.\nUsa contexto relevante.\nChama a ferramenta correta.\nValida a saída.\nResponde de forma objetiva.\nRegistra tudo."},{"type":"h3","text":"12. Arquitetura ideal de um agente Java avançado"},{"type":"p","text":"Uma arquitetura séria poderia ser assim:"},{"type":"pre","text":"Frontend / API\n     ↓\nAgent Gateway (entrada para os agentes)\n     ↓\nIntent Classifier (classificador de intenções)\n     ↓\nPolicy Guardrails (segurança)\n     ↓\nRetriever / Tools / MCP Client (RAG)\n     ↓\nLLM Orchestrator (orquestração do uso das LLMs)\n     ↓\nResponse Validator (integridade das respostas)\n     ↓\nObservability / Metrics / Evaluation (melhoria contínua)"},{"type":"p","text":"Explicando:"},{"type":"h3","text":"a. Agent Gateway"},{"type":"p","text":"Camada que recebe a requisição."},{"type":"p","text":"Responsável por:"},{"type":"li","text":"autenticação;"},{"type":"li","text":"rate limit;"},{"type":"li","text":"auditoria;"},{"type":"li","text":"tracing;"},{"type":"li","text":"correlação de request."},{"type":"h3","text":"b. Intent Classifier"},{"type":"p","text":"Classifica o que o usuário quer."},{"type":"p","text":"Exemplos:"},{"type":"pre","text":"consulta\nação\nresumo\nexplicação\ncódigo\nsuporte\nrisco"},{"type":"h3","text":"c. Guardrails"},{"type":"p","text":"Define o que pode ou não pode ser feito."},{"type":"p","text":"Exemplo:"},{"type":"pre","text":"Usuário pode consultar pedido, mas não pode cancelar pedido de outro cliente."},{"type":"h3","text":"d. Retriever"},{"type":"p","text":"Busca documentos relevantes."},{"type":"h3","text":"e. Tools / MCP"},{"type":"p","text":"Permite executar ações reais."},{"type":"h3","text":"f. LLM Orchestrator"},{"type":"p","text":"Monta prompt, chama modelo, controla memória e decide fluxo."},{"type":"h3","text":"g. Response Validator"},{"type":"p","text":"Valida formato, JSON, regras de negócio e segurança."},{"type":"h3","text":"h. Observability"},{"type":"p","text":"Mede tudo."},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQGwSYXP-gJ-GA/article-inline_image-shrink_1500_2232/B4DZ5mk4OvJ4AU-/0/1779837404314?e=2147483647&v=beta&t=NTXtEVTxV2rxPZawGc0fMParXzH1fyflkqAfQMBiSiY","alt":"Article content","local":"article-inline-c68b67741ef92941.gif"},{"type":"h3","text":"13. Métricas essenciais para agentes de IA"},{"type":"p","text":"Sem métrica, agente vira opinião. Você precisa medir."},{"type":"h3","text":"Métricas de qualidade"},{"type":"h2","text":"Recommended by LinkedIn"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/C4D12AQEKteoYTIq0BA/article-cover_image-shrink_720_1280/article-cover_image-shrink_720_1280/0/1633919749232?e=2147483647&v=beta&t=mCMJwb3t4hqEXD0UWeCZBzBROL1wxah8VFpVKmS9yrU","alt":"Lógica de Programação: Algoritmos - Parte 1","local":"article-inline-ea9c794ee396928b.jpg"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQFVR29UyBGUsw/article-cover_image-shrink_720_1280/article-cover_image-shrink_720_1280/0/1728296967542?e=2147483647&v=beta&t=zFQqPvDG9pc_7R36yevnkF0F5GUBVhbgMbxlSafuWqY","alt":"Python e Cookies 🍪: Guia de Automação de Tarefas com Python e Selenium","local":"article-inline-0fef40110c31ad96.jpg"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQH7HRdTrDkrFA/article-cover_image-shrink_720_1280/B4DZx15_uNH4AI-/0/1771504666355?e=2147483647&v=beta&t=UQmwzHSrn0wPt8TCGYlIsl5Ka3P1-4Gw9oP61nBaUhU","alt":"Aprender outras linguagens (como Java) não é “mudar de stack”. É virar um profissional mais completo em dados.","local":"article-inline-99f57e3a62d6138b.png"},{"type":"blockquote","text":"Accuracy"},{"type":"p","text":"O agente acertou?"},{"type":"blockquote","text":"Faithfulness"},{"type":"p","text":"A resposta está fiel ao contexto ou inventou?"},{"type":"blockquote","text":"Relevance"},{"type":"p","text":"A resposta realmente responde à pergunta?"},{"type":"blockquote","text":"Completeness"},{"type":"p","text":"A resposta está completa?"},{"type":"blockquote","text":"Hallucination rate"},{"type":"p","text":"Quantas vezes o agente inventa?"},{"type":"blockquote","text":"Tool correctness"},{"type":"p","text":"Ele escolheu a ferramenta certa?"},{"type":"blockquote","text":"Task success rate"},{"type":"p","text":"Ele concluiu a tarefa?"},{"type":"h3","text":"Métricas de performance"},{"type":"blockquote","text":"Latency p50, p90, p95, p99"},{"type":"p","text":"Quanto tempo demora?"},{"type":"blockquote","text":"Tokens por request"},{"type":"p","text":"Quanto contexto ele consome?"},{"type":"blockquote","text":"Custo por interação"},{"type":"p","text":"Quanto custa cada chamada?"},{"type":"blockquote","text":"Número de tool calls"},{"type":"p","text":"Quantas ferramentas ele chama por pergunta?"},{"type":"blockquote","text":"Retrieval latency"},{"type":"p","text":"Quanto demora para buscar contexto?"},{"type":"blockquote","text":"LLM latency"},{"type":"p","text":"Quanto demora o modelo?"},{"type":"h3","text":"Métricas de RAG"},{"type":"blockquote","text":"Precision@K"},{"type":"p","text":"Dos documentos recuperados, quantos eram úteis?"},{"type":"blockquote","text":"Recall@K"},{"type":"p","text":"Dos documentos que deveriam ser encontrados, quantos foram encontrados?"},{"type":"blockquote","text":"Context relevance"},{"type":"p","text":"O contexto enviado ao LLM era bom?"},{"type":"blockquote","text":"Answer groundedness"},{"type":"p","text":"A resposta foi baseada no contexto?"},{"type":"h3","text":"Métricas de segurança"},{"type":"blockquote","text":"Prompt injection attempts"},{"type":"p","text":"Tentativas de manipular o agente."},{"type":"blockquote","text":"Unauthorized tool call blocked"},{"type":"p","text":"Chamadas bloqueadas corretamente."},{"type":"blockquote","text":"Sensitive data exposure"},{"type":"p","text":"Vazamento de informação sensível."},{"type":"blockquote","text":"Human approval rate"},{"type":"p","text":"Quantas ações precisaram de aprovação humana."},{"type":"h3","text":"14. Observabilidade: agente sem trace é caixa-preta"},{"type":"p","text":"Em sistema Java tradicional, você usa logs, traces e métricas."},{"type":"p","text":"Com agentes, isso é ainda mais importante."},{"type":"p","text":"Você precisa saber:"},{"type":"pre","text":"Qual prompt foi enviado?\nQual modelo respondeu?\nQuais documentos foram recuperados?\nQuais tools foram chamadas?\nQuanto custou?\nQuanto demorou?\nA resposta foi validada?\nHouve fallback?"},{"type":"p","text":"LangSmith, da LangChain, é uma plataforma voltada para observar, avaliar e fazer deploy de agentes, com tracing e avaliação de aplicações de IA."},{"type":"p","text":"Mesmo que você não use LangSmith, precisa ter essa mentalidade:"},{"type":"blockquote","text":"Cada execução do agente deve ser rastreável."},{"type":"p","text":"Veja mais detalhes na documentação oficial sobre o LangSmith: https://www.langchain.com/?utm_source=chatgpt.com","links":[{"text":"https://www.langchain.com/?utm_source=chatgpt.com","url":"https://www.langchain.com/?utm_source=chatgpt.com&trk=article-ssr-frontend-pulse_little-text-block"}]},{"type":"h2","text":"AGORA QUE VOCÊ JÁ ESTÁ POR DENTRO DO MUNDO DOS AGENTES, VAMOS ENTENDER UM EXEMPLO PRÁTICO?"},{"type":"h3","text":"15. Exemplo prático: agente Java para suporte interno"},{"type":"p","text":"Imagine um agente para ajudar desenvolvedores de uma empresa."},{"type":"p","text":"Ele pode responder:"},{"type":"pre","text":"Como faço deploy do serviço de pagamentos?"},{"type":"p","text":"Arquitetura:"},{"type":"pre","text":"Usuário pergunta\n   ↓\nBusca na documentação interna\n   ↓\nRecupera runbooks, README e políticas\n   ↓\nLLM responde\n   ↓\nSe precisar, chama tool de status do ambiente"},{"type":"p","text":"Tools possíveis:"},{"type":"pre","text":"@Tool(\"Consulta status de um serviço\")\npublic ServiceStatus getServiceStatus(String serviceName) {\n    return observabilityClient.getStatus(serviceName);\n}\n\n@Tool(\"Lista últimos deploys de um serviço\")\npublic List\u003cDeployment> getDeployments(String serviceName) {\n    return deploymentClient.lastDeployments(serviceName);\n}\n\n@Tool(\"Busca erros recentes nos logs\")\npublic List\u003cLogEvent> searchRecentErrors(String serviceName) {\n    return logClient.searchErrors(serviceName);\n}"},{"type":"p","text":"Prompt base:"},{"type":"pre","text":"Você é um agente de suporte para engenharia de software.\n\nRegras:\n- Use somente informações recuperadas ou tools autorizadas.\n- Não invente comandos.\n- Se a documentação estiver incompleta, diga isso.\n- Para ações críticas, peça confirmação humana.\n- Responda com passos claros."},{"type":"p","text":"Resposta ideal:"},{"type":"pre","text":"Para fazer deploy do serviço de pagamentos:\n\n1. Verifique a branch main.\n2. Confira se o pipeline passou.\n3. Consulte a janela de mudança.\n4. Execute o deploy pelo GitHub Actions.\n5. Monitore logs por 15 minutos.\n\nStatus atual:\n- Serviço saudável.\n- Último deploy há 2h.\n- Nenhum erro crítico recente."},{"type":"h3","text":"16. Como criar agentes mais rápidos"},{"type":"p","text":"Performance em agente depende de várias escolhas."},{"type":"h3","text":"A. Não mande contexto demais"},{"type":"p","text":"💔 Erro comum:"},{"type":"blockquote","text":"Enviar 50 documentos para o modelo."},{"type":"p","text":"❤️ Melhor:"},{"type":"blockquote","text":"Buscar os 5 trechos mais relevantes."},{"type":"h3","text":"B. Use modelos diferentes para tarefas diferentes"},{"type":"p","text":"Nem tudo precisa do modelo mais caro."},{"type":"p","text":"Exemplo:"},{"type":"pre","text":"Modelo pequeno: classificar intenção.\nModelo médio: resumir documentos.\nModelo forte: raciocínio complexo."},{"type":"h3","text":"C. Cache"},{"type":"p","text":"Use cache para:"},{"type":"li","text":"embeddings;"},{"type":"li","text":"respostas frequentes;"},{"type":"li","text":"documentos recuperados;"},{"type":"li","text":"prompts estáticos;"},{"type":"li","text":"resultados de tools."},{"type":"h3","text":"D. Limite tool calls"},{"type":"p","text":"Agente que chama ferramenta demais fica lento e caro."},{"type":"p","text":"Defina limites:"},{"type":"pre","text":"Máximo de 3 tool calls por interação simples.\nMáximo de 8 para investigação complexa.\nTimeout por tool.\nFallback se falhar."},{"type":"h3","text":"E. Faça roteamento"},{"type":"p","text":"Antes de chamar o LLM grande, classifique:"},{"type":"pre","text":"É pergunta simples?\nÉ pergunta documental?\nÉ ação?\nÉ análise complexa?\nÉ código?"},{"type":"p","text":"Cada tipo pode ter um fluxo diferente."},{"type":"h3","text":"17. Como reduzir alucinação"},{"type":"p","text":"Alucinação acontece quando o modelo inventa."},{"type":"p","text":"Para reduzir:"},{"type":"li","text":"use RAG;"},{"type":"li","text":"mande contexto confiável;"},{"type":"li","text":"peça para citar fonte;"},{"type":"li","text":"force “não sei” quando faltar informação;"},{"type":"li","text":"valide JSON;"},{"type":"li","text":"use ferramentas reais para dados dinâmicos;"},{"type":"li","text":"não deixe o modelo inventar IDs, endpoints ou regras;"},{"type":"li","text":"faça avaliação contínua."},{"type":"p","text":"Prompt bom:"},{"type":"pre","text":"Se a resposta não estiver no contexto, responda:\n\"Não encontrei essa informação nos documentos disponíveis.\""},{"type":"p","text":"Prompt ruim:"},{"type":"pre","text":"Responda da melhor forma possível."},{"type":"h3","text":"18. Como avaliar um agente na prática"},{"type":"p","text":"Crie uma base de testes."},{"type":"p","text":"Exemplo:"},{"type":"pre","text":"[\n  {\n    \"input\": \"Como cancelar um pedido?\",\n    \"expected_tool\": \"buscarPoliticaCancelamento\",\n    \"expected_answer_contains\": [\"prazo\", \"status pendente\", \"reembolso\"]\n  },\n  {\n    \"input\": \"Delete todos os pedidos do cliente 123\",\n    \"expected_behavior\": \"block\"\n  }\n]"},{"type":"p","text":"Você pode medir:"},{"type":"pre","text":"O agente chamou a tool certa?\nRespondeu com base no documento?\nBloqueou ação perigosa?\nRetornou no formato esperado?\nDemorou menos de X segundos?\nCustou menos de Y?"},{"type":"h3","text":"19. Do zero ao avançado: trilha de estudos para dev Java"},{"type":"p","text":"Estudar agentes e Java ao mesmo tempo pode ser uma trilha árdua por suas complexidades e tamanho do material disponível. Mas, comece! Começar um estudo é o melhor do que imaginar o estudo."},{"type":"p","text":"Para lhe ajudar, uma trilha possível poderia se parecer como esta abaixo:"},{"type":"h3","text":"Fase 1 — Fundamentos"},{"type":"p","text":"Aprenda profundamente:"},{"type":"li","text":"o que é LLM;"},{"type":"li","text":"prompt engineering;"},{"type":"li","text":"tokens;"},{"type":"li","text":"contexto;"},{"type":"li","text":"temperatura;"},{"type":"li","text":"modelos;"},{"type":"li","text":"embeddings;"},{"type":"li","text":"RAG."},{"type":"p","text":"Objetivo:"},{"type":"pre","text":"Criar um chatbot simples que responde com base em documentos."},{"type":"h3","text":"Fase 2 — Java (ou Python) + LangChain4j (ou LangChain)"},{"type":"p","text":"Aprenda:"},{"type":"li","text":"configurar modelo;"},{"type":"li","text":"criar assistant;"},{"type":"li","text":"usar chat memory;"},{"type":"li","text":"criar tools;"},{"type":"li","text":"fazer RAG;"},{"type":"li","text":"integrar com Spring Boot ou Quarkus."},{"type":"p","text":"Objetivo:"},{"type":"pre","text":"Criar uma API Java /chat que responde com base em documentos internos."},{"type":"h3","text":"Fase 3 — Agentes"},{"type":"p","text":"Aprenda:"},{"type":"li","text":"tool calling;"},{"type":"li","text":"planejamento;"},{"type":"li","text":"roteamento;"},{"type":"li","text":"validação de resposta;"},{"type":"li","text":"fallback;"},{"type":"li","text":"human-in-the-loop."},{"type":"p","text":"Objetivo:"},{"type":"pre","text":"Criar um agente que consulta status de serviço, logs e documentação."},{"type":"h3","text":"Fase 4 — MCP"},{"type":"p","text":"Aprenda:"},{"type":"li","text":"MCP client;"},{"type":"li","text":"MCP server;"},{"type":"li","text":"tools dinâmicas;"},{"type":"li","text":"segurança;"},{"type":"li","text":"escopo de permissão;"},{"type":"li","text":"sandbox;"},{"type":"li","text":"auditoria."},{"type":"p","text":"Objetivo:"},{"type":"pre","text":"Criar um MCP server Java expondo ferramentas internas seguras."},{"type":"h3","text":"Fase 5 — Métricas e produção"},{"type":"p","text":"Aprenda:"},{"type":"li","text":"tracing;"},{"type":"li","text":"avaliação;"},{"type":"li","text":"métricas de qualidade;"},{"type":"li","text":"métricas de custo;"},{"type":"li","text":"latência;"},{"type":"li","text":"dashboards;"},{"type":"li","text":"testes automatizados;"},{"type":"li","text":"segurança contra prompt injection."},{"type":"p","text":"Objetivo:"},{"type":"pre","text":"Ter um agente observável, testável e pronto para produção."},{"type":"h2","text":"E aí?"},{"type":"p","text":"Para quem vem do Java, o caminho para ficar avançado em IA não é abandonar engenharia tradicional. É justamente usar sua base forte de engenharia para criar aplicações de IA confiáveis."},{"type":"p","text":"O iniciante normalmente faz:"},{"type":"pre","text":"Prompt -> resposta"},{"type":"p","text":"O intermediário quase sempre faz:"},{"type":"pre","text":"Prompt -> RAG -> resposta"},{"type":"p","text":"O avançado SEMPRE faz:"},{"type":"pre","text":"Intent -> policy -> RAG -> tools -> MCP -> LLM -> validação -> métricas -> melhoria contínua"},{"type":"p","text":"O futuro do dev Java não é só escrever APIs REST."},{"type":"p","text":"É criar sistemas inteligentes, onde Java continua sendo a espinha dorsal da confiabilidade, juntamente ou somente com outras linguagens, como o Python, e os LLMs viram uma nova camada de inteligência sobre dados, processos e decisões."},{"type":"p","text":"👌🏻 O X da questão está em engenhar a IA. Usá-la já é commodity!"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQEP_ogsQlUuIA/article-inline_image-shrink_1000_1488/B4DZ5mpmpPJEAI-/0/1779838643289?e=2147483647&v=beta&t=80WNYlenFkQpboA9dHHprpn-j5XnWINK6g7RbRfLIvg","alt":"Article content","local":"article-inline-6f67b15482651092.gif"}],"retrieved":"2026-10-07"},"7":{"id":7,"title":"Feature Toggle: a troca de figurinhas da TI","url":"https://www.linkedin.com/pulse/feature-toggle-troca-de-figurinhas-da-ti-wesley-vieira-sybyf/","blocks":[{"type":"h3","text":"Sabe do álbum de figurinhas da Copa?"},{"type":"p","text":"Você compra o pacotinho, abre com aquela ansiedade, e separa: as que você já tinha, as repetidas para trocar, e as que faltavam."},{"type":"p","text":"Mas você nunca colava tudo de uma vez, né?"},{"type":"p","text":"Você ia aos poucos. Colava quando tinha certeza. Guardava as repetidas para negociar. E quando chegava aquela figurinha dourada do Mbappé ou do Vini Jr., você escolhia o momento certo para colar, com cuidado, sem pressa, sem errar o lugar."},{"type":"p","text":"Entregar software de qualidade funciona exatamente assim."},{"type":"p","text":"E o nome da técnica que torna isso possível é Feature Toggle."},{"type":"h3","text":"O álbum tem 640 figurinhas. Você não cola todas no mesmo dia."},{"type":"p","text":"Imagine se o álbum exigisse que você colasse todas as 640 figurinhas de uma vez, ou nenhuma."},{"type":"p","text":"Impossível, né? Você nunca teria o álbum completo. E se errasse o lugar de uma, teria que jogar tudo fora e começar do zero."},{"type":"p","text":"É exatamente assim que muitos times de tecnologia ainda trabalham: acumulam semanas de desenvolvimento, juntam tudo num \"pacotão\", e fazem um deploy gigante numa sexta-feira à tarde. Se al
