go der errado, o fim de semana vai embora junto."},{"type":"p","text":"Feature Toggle muda esse jogo. Você cola as figurinhas uma a uma, no ritmo certo, sem medo de errar o álbum inteiro."},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQHxKIZ-R3ezRg/article-inline_image-shrink_1500_2232/B4DZ4h7wV5GcAU-/0/1778685774059?e=2147483647&v=beta&t=eD0SBwFcsVngKHV74Smv2pHyoNr-YAgrNgA8J_HfMYM","alt":"Article content","local":"article-inline-e7b1653b1d49d672.png"},{"type":"h3","text":"Mas o que é Feature Toggle e o que ele tem em comum com essa febre de figurinhas, afinal?"},{"type":"p","text":"Na sua essência, um Feature Toggle (também chamado de Feature Flag ou Feature Switch) é uma condição no código que permite ligar ou desligar uma funcionalidade em tempo real, sem precisar fazer um novo deploy."},{"type":"p","text":"É um interruptor. Uma chave. Um \"pode ou não pode\" controlado por você, não pelo calendário de deploy. Sem necessidade de novas mudanças em código ou na lógica do negócio, é possível desligar ou ligar uma funcionalidade. É como se houvesse a possibilidade de trocar uma figurinha que veio repetida ou que não é mais usada e, depois, voltar a trocar de novo essa mesma figurinha."},{"type":"p","text":"Veja um exemplo em código Java:"},{"type":"pre","text":"if (featureFlags.isEnabled('novo-checkout')) {\n  mostrarNovoCheckout();\n} else {\n  mostrarCheckoutAntigo();\n}"},{"type":"p","text":"Simples assim. Mas o poder não está no if. Está em quem controla esse if e em qual momento."},{"type":"h3","text":"De onde veio essa ideia?"},{"type":"p","text":"O conceito existe desde que times precisam de alta disponibilidade. Mas ganhou nome e forma nos anos 2000, com a ascensão das práticas ágeis e do Continuous Delivery."},{"type":"p","text":"O livro Continuous Delivery, de Jez Humble e David Farley (2010), formalizou feature toggles como um dos pilares para times que querem entregar software com frequência e segurança."},{"type":"p","text":"O Flickr foi um dos primeiros a documentar publicamente o uso de flags para coordenar dezenas de engenheiros na mesma base de código. Depois vieram Facebook, Google, Netflix e Nubank: todos usando a mesma filosofia em escala industrial."},{"type":"p","text":"Hoje é considerada prática obrigatória em qualquer time que se leva a sério e que deseja manter suas aplicações com alta disponibilidade e reutilizáveis."},{"type":"h3","text":"Voltando às analogias das figurinhas repetidas: o poder do rollout gradual"},{"type":"p","text":"Você já trocou figurinha assim: \"eu te dou 3 repetidas pelo Neymar\"? Você negocia, testa o interesse, vai aumentando a oferta até fechar."},{"type":"p","text":"No software, isso se chama Canary Release, e funciona da mesma forma, técnica que é utilizada junto ao Feature Toggle."},{"type":"p","text":"Em vez de ativar uma feature nova para todos os seus usuários de uma vez (colar a figurinha sem olhar onde), você ativa para 1%. Observa as métricas. Está tudo bem? Vai para 10%. Ainda bem? Para 50%. E daí para 100%."},{"type":"p","text":"Se algo der errado no caminho, você desliga. Ninguém foi afetado em escala. Nenhum deploy de rollback. Nenhuma madrugada acordado."},{"type":"p","text":"É trocar figurinha com cautela antes de colar, sem precisar ficar mexendo no album, tentando tirar a figurinha já colada até rasgar a página."},{"type":"p","text":"No mundo da tecnologia, é o mesmo que mudar uma funcionalidade para outra sem precisar alterar, ajustar ou até mesmo quebrar uma solução inteira."},{"type":"h3","text":"Os quatro tipos de figurinha no seu álbum de flags"},{"type":"p","text":"Nem toda figurinha serve para o mesmo espaço. Existe a comum, a brilhante, a dourada, a de time. No mundo de feature toggles, Peter Hodgson, em artigo clássico publicado no site de Martin Fowler, define quatro categorias:"},{"type":"p","text":"🟡 Release Toggle: a figurinha que você está guardando pra colar."},{"type":"p","text":"Você já tem o código pronto. Mas a feature fica \"escondida\" enquanto o produto não está 100% finalizado, ou enquanto o marketing não deu o sinal verde. Quando estiver na hora, você cola. Dura dias ou semanas."},{"type":"p","text":"🔵 Experiment Toggle: a figurinha que você mostra pra ver a reação."},{"type":"p","text":"Metade dos seus usuários vê a versão A. A outra metade vê a versão B. Você mede qual converte mais, engaja mais, vende mais. A decisão é tomada com dado, não com achismo. É assim que Amazon e Booking.com tomam decisões de produto todos os dias.","links":[{"text":"Booking.com","url":"https://www.linkedin.com/redir/redirect?url=http%3A%2F%2FBooking%2Ecom&urlhash=9yVP&trk=article-ssr-frontend-pulse_little-text-block"}]},{"type":"p","text":"🟠 Ops Toggle: a figurinha de segurança."},{"type":"p","text":"Imagine que você colou uma figurinha torta. Com ops toggle, você tem como descolar sem rasgar a página. São os \"kill switches\" operacionais: desligar uma integração instável, reduzir carga em horário de pico, proteger o sistema em situações de emergência."},{"type":"p","text":"🟣 Permission Toggle: a figurinha exclusiva."},{"type":"p","text":"Alguns álbuns tinham aquela figurinha especial que só vinha nos pacotes premium. No software, é a feature que usuários VIP acessam antes de todo mundo. Admins têm painéis restritos. Clientes enterprise veem funcionalidades que o plano básico não tem."},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQG8bWicD_xFcQ/article-inline_image-shrink_1000_1488/B4DZ4h.J4bJQAQ-/0/1778686402789?e=2147483647&v=beta&t=C8io4ntEel_qnvyDcKXeB5boUGV5KclM2D5goK2UadY","alt":"Article content","local":"article-inline-9c901d5fe6eb4171.png"},{"type":"h3","text":"Separar o deploy do lançamento: colar sem mostrar"},{"type":"p","text":"Aqui está o insight mais importante e o que mais muda a forma de um time trabalhar."},{"type":"p","text":"Quando você compra um pacote de figurinhas, você não mostra o álbum pra todo mundo antes de ter colado as que queria. Você separa, organiza, e só exibe quando está satisfeito."},{"type":"p","text":"No software convencional, deploy e lançamento são a mesma coisa. Você sobe o código e o usuário já vê."},{"type":"p","text":"Com feature toggle, você separa os dois:"},{"type":"h2","text":"Recommended by LinkedIn"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQFPl2mkM4P-_Q/article-cover_image-shrink_600_2000/article-cover_image-shrink_600_2000/0/1695472898197?e=2147483647&v=beta&t=o1RdeID99ZZ4zIb4Icy0Jj2qmXUxtwEtPSerAZ7ho5c","alt":"Desvendando os Segredos dos Testes de Acessibilidade: Por que, Como e Quais Benefícios?","local":"article-inline-3247b6a2cd2ecb1a.jpg"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQH7PbaUvtRweQ/article-cover_image-shrink_720_1280/article-cover_image-shrink_720_1280/0/1726228721806?e=2147483647&v=beta&t=MD-H3Mg0LNO3PgsuwbYG3Ed6mRuqSLfxTDgnc6Qmn50","alt":"Bites Trends #63 (13.09.2024)","local":"article-inline-9239547b4dcbf416.png"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4E12AQGSAiCZJZQKnw/article-cover_image-shrink_720_1280/article-cover_image-shrink_720_1280/0/1733344158764?e=2147483647&v=beta&t=BKh8EPPaaI4QB4TkTJ0hi0FG0F35PqZzD8REydAXAAU","alt":"Os pilares são do BIM ou do PDP?","local":"article-inline-b8dfec08fe7d643c.png"},{"type":"li","text":"Deploy é ato técnico. Acontece quando o código está pronto."},{"type":"li","text":"Lançamento é decisão de negócio. Acontece quando o produto, o marketing, o comercial decidirem, controlado pelo Feature Toggle, sem necessidade de alteração do Core do software."},{"type":"p","text":"O time de engenharia nunca mais fica refém do calendário de outros departamentos. E o produto nunca mais precisa esperar o deploy para fazer um lançamento."},{"type":"h3","text":"Trunk-Based Development: todo mundo colando no mesmo álbum"},{"type":"p","text":"Tem uma prática chamada Trunk-Based Development que é o coração de como times de elite trabalham: todo o time commita na mesma branch principal, com frequência, sem branches que vivem semanas isoladas (há discordâncias sobre o uso dessa forma de trabalho com a outra chamada Git Flow)."},{"type":"p","text":"O problema óbvio que se existe nisso é: como você faz commit de código incompleto sem quebrar o produto?"},{"type":"p","text":"É como se quatro amigos estivessem completando o mesmo álbum ao mesmo tempo. Sem organização, vira bagunça, alguém cola em cima do outro, figurinha no lugar errado, página rasgada."},{"type":"p","text":"Feature toggle resolve isso."},{"type":"p","text":"Você faz o commit. O código core está lá. A flag está desligada. O produto não muda. Você continua evoluindo o código em commits posteriores. Quando estiver completo, você liga a flag."},{"type":"p","text":"É cada um colando sua parte, sem atrapalhar o álbum do outro, até o momento certo de mostrar o resultado."},{"type":"h3","text":"Como implementar esse tal de Feature Toggle? Do pacotinho básico ao álbum completo"},{"type":"p","text":"Nível 1. Pacotinho de R$ 7 (variável de ambiente)"},{"type":"pre","text":"FEATURE_NOVO_DASHBOARD=true"},{"type":"p","text":"Zero dependência. Funciona. Mas exige restart da aplicação para mudar o valor. Bom para começar."},{"type":"p","text":"Nível 2. Pacote duplo (config dinâmica no banco)"},{"type":"p","text":"A flag fica num banco ou arquivo de config carregado em runtime. Você muda o valor sem reiniciar o serviço. Já dá pra fazer rollout e desligar em emergências."},{"type":"p","text":"Nível 3. Álbum oficial da FIFA (plataforma dedicada)"},{"type":"p","text":"Para escala real, times usam ferramentas específicas:"},{"type":"li","text":"LaunchDarkly: líder de mercado, SDK para qualquer linguagem"},{"type":"li","text":"Unleash: open source, self-hosted"},{"type":"li","text":"Flagsmith: open source com opção cloud"},{"type":"li","text":"Split.io:  foco em experimentação","links":[{"text":"Split.io","url":"https://www.linkedin.com/redir/redirect?url=http%3A%2F%2FSplit%2Eio&urlhash=SJ0K&trk=article-ssr-frontend-pulse_little-text-block"}]},{"type":"li","text":"AWS AppConfig / Azure App Configuration: para quem já está na cloud"},{"type":"p","text":"Essas plataformas oferecem segmentação por usuário, percentual de rollout, auditoria completa e integração com ferramentas de monitoramento."},{"type":"p","text":"Ou, se necessário, há empresas que criam suas próprias formas e meios de gerenciar seus Features Toggles."},{"type":"h3","text":"Os erros que todo time comete (as figurinhas coladas no lugar errado)"},{"type":"p","text":"Não limpar toggles mortos."},{"type":"p","text":"Flag criada para o lançamento de 2022 ainda no código em 2026 é dívida técnica. É como manter o álbum da Copa de 2018 aberto na gaveta achando que ainda vai completar. Toda flag deve ter uma data de expiração definida no momento da criação."},{"type":"p","text":"Toggle explosion."},{"type":"p","text":"Times que descobrem feature flags e criam uma para cada respirada acabam com 200 flags ativas que ninguém sabe o estado correto. É o armário cheio de pacotes não abertos sem saber o que está duplicado. Governance importa: nomeie bem, documente, audite."},{"type":"p","text":"Não testar os dois caminhos."},{"type":"p","text":"Se você tem \"if featureFlag\" no seu código, você tem dois caminhos de código. É como ter duas versões do álbum: a com a figurinha e a sem. Ambas precisam funcionar. Ignorar o caminho do else é a receita para bugs silenciosos em produção."},{"type":"h3","text":"O impacto real no negócio"},{"type":"p","text":"O relatório DORA (DevOps Research and Assessment), o maior estudo sobre performance de times de engenharia, com dados de milhares de organizações no mundo, mostra que times de elite fazem deploy múltiplas vezes por dia, com taxa de falha mínima e tempo de recuperação medido em minutos."},{"type":"p","text":"O que diferencia esses times dos mediocres não é a linguagem de programação. Não é o cloud provider. É a capacidade de entregar com frequência e sem medo."},{"type":"p","text":"Feature toggle é um dos pilares disso."},{"type":"p","text":"A empresa que consegue testar uma hipótese de produto em dias, não em meses, tem uma vantagem competitiva real. É a diferença entre o colecionador que completa o álbum na primeira semana e o que ainda está tentando na final do campeonato pois fica colando e descolando figurinhas que não quer mais ou que colou de qualquer jeito, sem cuidado."},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQF5uQR_gvSyzg/article-inline_image-shrink_1000_1488/B4DZ4iAhtwHAAQ-/0/1778687025406?e=2147483647&v=beta&t=9-zrzsQn_OvI_Rtbz3JaU56USrrq-JcoSZF822sHeIA","alt":"Article content","local":"article-inline-c25cbbd3174942bd.png"},{"type":"p","text":"Completar o álbum da Copa não exige colar todas as figurinhas de uma vez, às cegas, torcer para não errar e nunca poder consertar."},{"type":"p","text":"Exige estratégia: saber o que você tem, o que falta, o que guardar, o que trocar, e o momento certo de colar cada uma."},{"type":"p","text":"Feature Toggle é essa estratégia aplicada ao software."},{"type":"p","text":"Times que dominam isso entregam mais rápido, com menos risco, dormem tranquilos nas sextas-feiras, e constroem produtos melhores porque testam hipóteses de verdade, não na base do achismo."},{"type":"p","text":"Se você ainda não usa, comece hoje. Com uma variável de ambiente. Com um campo no banco. O mais simples que for."},{"type":"p","text":"O importante é mudar o hábito mental: antes de criar uma branch longa, pense em criar uma flag. Antes de colocar todo o álbum em jogo de uma vez, pense em colar uma figurinha por vez."},{"type":"p","text":"O álbum mais bonito não é o que foi colado mais rápido. É o que foi colado com mais inteligência."},{"type":"p","text":"E aí, Neymar irá pra Copa ou não?"},{"type":"p","text":"Essa feature flag está nas mãos do mister."},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQF81fsRAUm9eg/article-inline_image-shrink_1500_2232/B4DZ4iBQi8HIAU-/0/1778687217137?e=2147483647&v=beta&t=WnwOCLnPhgwRm5KXJ0g5TAeqRZcyP_ztj7XCh__Ua6E","alt":"Article content","local":"article-inline-0ad855092f459ece.png"}],"retrieved":"2026-10-07"},"8":{"id":8,"title":"Segurança na Internet Descomplicada: Entendendo TLS, SSL, IPSec e DNSSEC","url":"https://www.linkedin.com/pulse/seguran%C3%A7a-na-internet-descomplicada-entendendo-tls-ssl-wesley-vieira-ixuwf/","blocks":[{"type":"p","text":"Você já se perguntou como suas senhas, dados bancários e mensagens privadas viajam pela internet sem serem interceptados? A resposta está em quatro tecnologias essenciais que funcionam como \"envelopes lacrados\" para seus dados digitais. Vamos descomplicar!"},{"type":"h3","text":"🏰 A Analogia do Castelo Medieval"},{"type":"p","text":"Imagine a internet como uma cidade medieval. Seus dados são mensagens importantes que precisam atravessar territórios perigosos cheios de ladrões (hackers). Como proteger essas mensagens?"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQEQBZEXH7_zsQ/article-inline_image-shrink_1000_1488/B4DZuOuTclJkAY-/0/1767626062592?e=2147483647&v=beta&t=uzSk6XZRfDTpkdsSy0LlcPZQFmwA76GHaULDXzfj8RM","alt":"Article content","local":"article-inline-f5eeb227f16ab345.png"},{"type":"h3","text":"🔐 SSL/TLS: O Envelope Lacrado"},{"type":"p","text":"O que é? SSL (Secure Sockets Layer) e seu sucessor TLS (Transport Layer Security) são como envelopes lacrados com cera especial que só você e o destinatário conseguem abrir."},{"type":"p","text":"Analogia do Mundo Real:"},{"type":"li","text":"Você escreve uma carta (seus dados);"},{"type":"li","text":"Coloca em um envelope especial (SSL/TLS);"},{"type":"li","text":"Lacra com cera única que só o destinatário tem a chave para abrir;"},{"type":"li","text":"Mesmo que alguém roube o envelope, não consegue ler o conteúdo."},{"type":"p","text":"Na Prática: Quando você vê o cadeado 🔒 no navegador e \"https://\" na URL, o SSL/TLS está protegendo você!"},{"type":"p","text":"Exemplo Real:"},{"type":"p","text":"🚫 Sem SSL/TLS:"},{"type":"p","text":"Você → [senha123] → Banco"},{"type":"p","text":"(Hacker vê no meio da comunicação: senha123)"},{"type":"p","text":"✅ Com SSL/TLS:"},{"type":"p","text":"Você → [XyZ@#$%^&*] → Banco"},{"type":"p","text":"(Hacker vê: código embaralhado indecifrável)"},{"type":"p","text":"Usos Comuns:"},{"type":"li","text":"Sites de compras online"},{"type":"li","text":"Internet banking"},{"type":"li","text":"E-mail corporativo"},{"type":"li","text":"Redes sociais"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQE3GJOLEdjyNQ/article-inline_image-shrink_1500_2232/B4DZuOuqy0IEAU-/0/1767626158062?e=2147483647&v=beta&t=adobiNHD4nNyT5RTCcLHwfGSbz5WunSv14yB3SNHgKk","alt":"Article content","local":"article-inline-6674d6c74777cb03.png"},{"type":"h3","text":"🛡️ E o IPSec? O Túnel Secreto"},{"type":"p","text":"O que é? IPSec (Internet Protocol Security) é como um túnel subterrâneo secreto entre dois castelos, onde TODA comunicação passa protegida."},{"type":"p","text":"Analogia do Mundo Real:"},{"type":"li","text":"Imagine uma mangueira opaca conectando sua casa ao escritório"},{"type":"li","text":"Tudo que passa por dentro é invisível para quem está fora"},{"type":"li","text":"Mesmo que alguém corte a mangueira, só vê tinta preta (dados criptografados)"},{"type":"p","text":"Diferença do SSL/TLS:"},{"type":"li","text":"SSL/TLS: Protege aplicações específicas (como HTTPS para sites)"},{"type":"li","text":"IPSec: Protege TODA a comunicação entre dois pontos, não importa o aplicativo"},{"type":"p","text":"Na Prática: Usado principalmente em VPNs corporativas para conectar:"},{"type":"li","text":"Funcionários remotos à empresa"},{"type":"li","text":"Filiais de uma empresa entre si"},{"type":"li","text":"Parceiros de negócios de forma segura"},{"type":"p","text":"Exemplo Real:"},{"type":"p","text":"🏠 Home Office → [Túnel IPSec] → 🏢 Empresa"},{"type":"p","text":"Dentro do túnel:"},{"type":"p","text":"- E-mails"},{"type":"p","text":"- Arquivos compartilhados"},{"type":"p","text":"- Sistemas internos"},{"type":"p","text":"- Videoconferências"},{"type":"p","text":"Tudo protegido automaticamente!"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQG48I2PxMEMhA/article-inline_image-shrink_400_744/B4DZuOu3kXH8AY-/0/1767626210383?e=2147483647&v=beta&t=0hgaLQDJ5A0dfiayqqloQanNVB9Yrg26mWlK6H8mUDs","alt":"Article content","local":"article-inline-52a5363d25cd1480.png"},{"type":"h3","text":"🗺️ E o que é o DNSSEC? O Carteiro Confiável"},{"type":"p","text":"O que é? DNSSEC (Domain Name System Security Extensions) é como ter um carteiro que verifica a identidade real do destinatário antes de entregar a carta."},{"type":"p","text":"Analogia do Mundo Real: Imagine que você quer enviar uma carta para \"Banco XYZ\":"},{"type":"li","text":"Sem DNSSEC: O carteiro entrega no primeiro lugar com placa \"Banco XYZ\" (pode ser falso!)"},{"type":"li","text":"Com DNSSEC: O carteiro verifica documentos oficiais antes de entregar"},{"type":"p","text":"O Problema que Resolve: Na internet, quando você digita \"banco.com.br\", seu computador pergunta ao DNS \"qual o endereço IP desse site?\". Hackers podem fingir ser o DNS e te enviar para um site FALSO (ataque chamado \"DNS Spoofing\").","links":[{"text":"banco.com.br","url":"https://www.linkedin.com/redir/redirect?url=http%3A%2F%2Fbanco%2Ecom%2Ebr&urlhash=A7Rk&trk=article-ssr-frontend-pulse_little-text-block"}]},{"type":"h2","text":"Recommended by LinkedIn"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQFwpQbjXXJU2A/article-cover_image-shrink_720_1280/B4DZT2KkF2HAAI-/0/1739296752678?e=2147483647&v=beta&t=RsFl4aG0aUNdTCGeiEUqgcm_uoE-v-Y-vkJtRU0hiJU","alt":"Levantando um servidor proxy de ofuscação de tráfego (PoC)","local":"article-inline-67c88e595aa71d16.jpg"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQFMdkBArFoEEw/article-cover_image-shrink_720_1280/article-cover_image-shrink_720_1280/0/1687977129282?e=2147483647&v=beta&t=DjEoWplLvPOxqbhHcH19q8_Che0VCVGoGZqLvZW03es","alt":"Comparação de Métodos de Autenticação em Redes Wi-Fi: PSK vs Enterprise vs Open e a Segurança do WPS","local":"article-inline-c6729c904e463faf.jpg"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQGFB0amSxPacA/article-cover_image-shrink_720_1280/B4DZ83WbTqGYAQ-/0/1783340055126?e=2147483647&v=beta&t=ztTmKA_a1MW_Dn_96W57ZKG7ZBeOvHXiuPUnXXt4q_k","alt":"Agentes de IA, identidade e borda sob controle de autonomia","local":"article-inline-eec9ebcaef359f88.png"},{"type":"p","text":"Como Funciona:"},{"type":"p","text":"Você digita: www.meusite.com","links":[{"text":"www.meusite.com","url":"https://www.linkedin.com/redir/redirect?url=http%3A%2F%2Fwww%2Emeusite%2Ecom&urlhash=xtSC&trk=article-ssr-frontend-pulse_little-text-block"}]},{"type":"p","text":"❌ Sem DNSSEC:"},{"type":"p","text":"DNS → \"O endereço é 192.168.1.1\""},{"type":"p","text":"(Hacker intercepta e mente: \"Não, é 666.666.666.666\")"},{"type":"p","text":"Você → Site FALSO 💀"},{"type":"p","text":"✅ Com DNSSEC:"},{"type":"p","text":"DNS → \"O endereço é 192.168.1.1\" + [Assinatura Digital Verificada ✓]"},{"type":"p","text":"(Hacker não consegue falsificar a assinatura)"},{"type":"p","text":"Você → Site VERDADEIRO 🎯"},{"type":"p","text":"Importância: Protege contra:"},{"type":"li","text":"Sites falsos (phishing)"},{"type":"li","text":"Redirecionamentos maliciosos"},{"type":"li","text":"Ataques man-in-the-middle no DNS"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQEN3Slu81JLhA/article-inline_image-shrink_400_744/B4DZuOv.NPKQAc-/0/1767626499763?e=2147483647&v=beta&t=1yi1Slm_AedqLnDINvBnIoLE8MTPpfUo388qfZd_Gec","alt":"Article content","local":"article-inline-eac25be09c0c86bc.png"},{"type":"h3","text":"📊 Comparação Rápida: Quando Usar Cada Um?"},{"type":"p","text":"SSL/TLS"},{"type":"li","text":"O que protege: Dados entre navegador e site;"},{"type":"li","text":"Usado por: Sites e apps;"},{"type":"li","text":"Exemplo: Amazon e Gmail."},{"type":"p","text":"IPSec"},{"type":"li","text":"O que protege: Toda comunicação entre redes;"},{"type":"li","text":"Usado por: VPNs;"},{"type":"li","text":"Exemplo: Empresas multinacionais e redes de comunicação;"},{"type":"p","text":"DNSSEC"},{"type":"li","text":"O que protege: Resolução de nomes de domínio;"},{"type":"li","text":"Usado por: Provedores, DNS;"},{"type":"li","text":"Exemplo: Google DNS*"},{"type":"p","text":"* Entenda melhor o que é e como funciona um serviço de DNS aqui: https://pt.wikipedia.org/wiki/Sistema_de_Nomes_de_Domínio","links":[{"text":"https://pt.wikipedia.org/wiki/Sistema_de_Nomes_de_Domínio","url":"https://pt.wikipedia.org/wiki/Sistema_de_Nomes_de_Domínio?trk=article-ssr-frontend-pulse_little-text-block"}]},{"type":"h3","text":"🎯 Em Resumo: Trabalhando Juntos"},{"type":"p","text":"Essas tecnologias não competem, elas se complementam:"},{"type":"p","text":"Cenário Real - Você Trabalhando de Casa:"},{"type":"p","text":"1️⃣ DNSSEC verifica que \"empresa.com.br\" é legítimo","links":[{"text":"empresa.com.br","url":"https://www.linkedin.com/redir/redirect?url=http%3A%2F%2Fempresa%2Ecom%2Ebr&urlhash=Zwf_&trk=article-ssr-frontend-pulse_little-text-block"}]},{"type":"p","text":"2️⃣ IPSec cria túnel seguro entre sua casa e a empresa (VPN)"},{"type":"p","text":"3️⃣ TLS protege seus dados dentro de cada aplicação (e-mail, sistemas)"},{"type":"p","text":"É como ter:"},{"type":"li","text":"🗺️ Um mapa confiável (DNSSEC)"},{"type":"li","text":"🚇 Um metrô subterrâneo seguro (IPSec)"},{"type":"li","text":"📦 Pacotes lacrados dentro do metrô (TLS)"},{"type":"h3","text":"💡 Dicas Práticas para Você:"},{"type":"p","text":"✅ Sempre verifique o cadeado 🔒 e se o site tem https em sua URL antes de inserir dados sensíveis em sites"},{"type":"p","text":"✅ Use VPN confiável se for usar Wi-Fi público (IPSec protegendo você)"},{"type":"p","text":"✅ Ative verificação em duas etapas (camada extra além do TLS)"},{"type":"p","text":"✅ Desconfie de links suspeitos (DNSSEC não protege se você clicar em links maliciosos)"},{"type":"h3","text":"🚀 Conclusão"},{"type":"p","text":"A segurança digital é como uma cebola 🧅 com várias camadas. Quanto mais camadas, mais protegido você está. TLS, IPSec e DNSSEC são três dessas camadas essenciais que trabalham silenciosamente para manter seus dados seguros."},{"type":"p","text":"Lembre-se: Tecnologia é complicada, mas os conceitos não precisam ser! 💪"},{"type":"p","text":"E você, já reparou no cadeado 🔒 no seu navegador hoje? Compartilhe nos comentários uma dúvida que ainda tem sobre segurança digital!"},{"type":"p","text":"#Cibersegurança #TecnologiaDescomplicada #SSL #TLS #IPSec #DNSSEC #SegurançaDigital #Tecnologia #LinkedIn #Inovação"},{"type":"p","text":"💬 Gostou? Salve este post para consultar depois e compartilhe com quem precisa entender essas tecnologias de forma simples!"}],"retrieved":"2026-10-07"},"9":{"id":9,"title":"A arte de observar: o que a Copa do Mundo de Clubes ensina sobre monitoramento de sistemas","url":"https://www.linkedin.com/pulse/arte-de-observar-o-que-copa-do-mundo-clubes-ensina-sobre-vieira-qvbbf/","blocks":[{"type":"p","text":"Imagine a final da Copa do Mundo de Clubes. Em campo, jogadores de alto nível (pense neles como microserviços) cooperam para atingir um objetivo comum: vencer o jogo. À beira do gramado, o técnico e sua comissão (analogia aos engenheiros de observabilidade) monitoram cada movimento. Como eles fazem isso? Usando dados! Nos treinos e jogos modernos, os jogadores vestem coletes com sensores GPS, que transmitem métricas como distância percorrida, velocidade e batimentos cardíacos. Essas informações são coletadas em tempo real e exibidas em telões ou tablets para a comissão técnica analisar."},{"type":"p","text":"Da mesma forma, em sistemas distribuídos, precisamos monitorar o desempenho e a saúde de cada serviço. As ferramentas de observabilidade desempenham exatamente esse papel: o Micrometer funciona como os sensores nos jogadores, o Prometheus é como o sistema que coleta todos esses dados (tal qual a central de monitoramento do time), e o Grafana é o “telão” que exibe painéis bonitos com as estatísticas para entendermos o que está acontecendo. E assim como um técnico faz ajustes no time com base nos dados, nós ajustamos nossos sistemas com base nas métricas, logs e traces coletados. Neste artigo, vamos construir uma aplicação Java Spring Boot simples (com endpoints /hello e /slow) instrumentada com Micrometer, coletar métricas com Prometheus, visualizá-las com Grafana– tudo isso usando analogias futebolísticas para tornar o aprendizado divertido e acessível. Preparado para entrar em campo? ⚒️🚀"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQFzNcH64JiyVA/article-inline_image-shrink_1500_2232/B4DZd58PzLHMCA-/0/1750097527000?e=2147483647&v=beta&t=FTpijMz5l_Zj2qf2g-Bq5wRg55PZBzkRoAPzvs10XJs","alt":"Article content","local":"article-inline-3ea1b5a7a29e1e07.png"},{"type":"h2","text":"Conceitos de observabilidade: logs, métricas e traces"},{"type":"p","text":"Antes de colocar a “bola em jogo” com código, vale recapitular os três pilares da observabilidade em sistemas modernos – frequentemente definidos como logs, métricas e traces. Cada um deles nos fornece uma visão diferente do sistema, assim como estatísticas diferentes de uma partida de futebol:"},{"type":"p","text":"Logs: são registros de eventos detalhados que acontecem no sistema, no formato de textos (linhas de log). Eles funcionam como uma narração ou súmula do jogo – cada jogada importante é anotada. Por exemplo, um log pode indicar \"Jogador X recebeu a bola na defesa e passou para Y...\", enquanto no sistema um log pode ser \"Usuário 123 solicitou recurso /api/dados\" com timestamp. Logs ajudam a entender o contexto histórico de eventos e são a primeira fonte a investigar quando algo dá errado. Assim como um técnico pode rever a súmula ou a gravação de uma partida para analisar erros, um engenheiro revisa os logs para depurar problemas. Contudo, em arquiteturas de microserviços com muitos “jogadores”, correlacionar logs de diferentes serviços (cada um em um “campo” diferente) pode ser tão desafiador quanto acompanhar uma partida com dezenas de bolas em campo ao mesmo tempo!"},{"type":"p","text":"Métricas: são medidas numéricas ao longo do tempo que indicam o desempenho ou estado do sistema. No futebol, métricas são as estatísticas do placar e do scout: posse de bola (%), número de finalizações, distância percorrida por cada jogador, etc. Em sistemas, métricas incluem por exemplo o uso de CPU, memória, contagem de requisições por segundo, latência média das respostas, taxa de erros, entre outros. As métricas fornecem uma visão quantitativa e resumida da “partida” que o sistema está jogando, permitindo identificar tendências e anomalias de performance. Por exemplo, um gráfico de métricas pode mostrar que a latência do endpoint /slow aumentou após uma certa hora – assim como um gráfico poderia mostrar que o desempenho físico dos jogadores caiu no segundo tempo, indicando cansaço. Métricas são ótimas para alertar quando algo está fora do normal (como um placar indicando um gol contra 😅), mas nem sempre explicam por que aquilo ocorreu – para isso, precisamos de contexto extra dos logs e traces."},{"type":"p","text":"Traces (Rastreamentos): são como replays detalhados de uma jogada. Eles acompanham o caminho completo de uma requisição através de múltiplos microserviços, registrando quanto tempo foi gasto em cada etapa. Em analogia, um trace equivale a analisar aquela jogada de gol que envolveu toques entre vários jogadores: você segue o “trajeto da bola” desde a defesa até o gol, vendo quem participou e quanto tempo cada um manteve a bola. No mundo dos sistemas, um trace distribuído pode mostrar, por exemplo, que uma chamada do serviço A para o B demorou 200ms, então o B chamou o C demorando mais 300ms, antes de retornar – totalizando 500ms de latência para o usuário. Isso ajuda a identificar gargalos (quem está “cozinhando a bola” no ataque) e dependências. Os traces oferecem visão detalhada do tempo gasto em cada etapa de uma solicitação, sendo essenciais para diagnosticar problemas em arquiteturas complexas de microserviços que funcionam como um time entrosado. Ferramentas modernas (como o Grafana Tempo, Zipkin ou Jaeger) coletam e analisam traces, permitindo que associemos traces com logs e métricas para um diagnóstico mais rápido e preciso de problemas."},{"type":"p","text":"Resumindo esses pilares em termos futebolísticos: logs são o registro textual de cada lance, métricas são os números do placar e do scout do jogo, e traces são a reconstituição das jogadas-chave. Juntos, fornecem uma visão 360° do sistema. A observabilidade é justamente sobre ter essa capacidade de entender o estado interno do sistema a partir desses dados que ele gera. Assim como um técnico campeão analisa vídeos, estatísticas e relatórios para preparar o time, nós desenvolvedores/análise usamos logs, métricas e traces para compreender e melhorar nossos sistemas."},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQE60POtuJKsxg/article-inline_image-shrink_1500_2232/B4DZd58Py6GYAY-/0/1750097526559?e=2147483647&v=beta&t=RTqaz_ri1Db16M-oPYrLTHbP43FmWtHWp5vXJSdpI3E","alt":"Article content","local":"article-inline-15e620a0e9e47c08.png"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQH3zbOV5mWZGg/article-inline_image-shrink_1000_1488/B4DZd58Py4GkAY-/0/1750097526467?e=2147483647&v=beta&t=ihG-SK1Ku-Yl5T8hYFkQdaberGLgrDEx-390KV4qDM4","alt":"Article content","local":"article-inline-57db5d8a94daf696.png"},{"type":"h2","text":"Mãos na massa: construindo uma aplicação Spring Boot instrumentada com Micrometer"},{"type":"p","text":"Chegou a hora de sairmos da teoria para a prática e construir nossa “seleção” de microserviços – ou melhor, nossa aplicação Spring Boot de exemplo – já preparada com observabilidade. Vamos criar uma aplicação Java simples com Spring Boot que terá dois endpoints de API REST:"},{"type":"li","text":"GET /hello – Retorna uma saudação simples (sim, o clássico \"Hello, World!\"). Este endpoint será rápido, representando aquela jogada de lateral simples."},{"type":"li","text":"GET /slow – Simula uma resposta lenta, por exemplo, fazendo o thread dormir por alguns segundos antes de responder. Este representa uma jogada demorada, talvez uma construção de ataque mais elaborada que gasta tempo."},{"type":"p","text":"Usaremos o Micrometer para instrumentar esses endpoints com métricas personalizadas. O Micrometer, como definido pela própria documentação, é um “facade” de observabilidade para aplicações, neutro em relação a provedores. Em outras palavras, ele é para métricas o que o SLF4J é para logs – uma interface genérica que pode enviar dados de métricas para diversos sistemas (Prometheus, Datadog, New Relic, etc.) sem acoplar nossa aplicação a um monitor específico. No nosso caso, usaremos o registrador do Prometheus (Micrometer \u003c> Prometheus). Ou seja, é como se o Micrometer fosse capturar os dados da aplicação (como um estatístico de futebol ou plataforma para isso) para que o Prometheus centralizasse e mostrasse estes dados em algum dashboard (no futebol poderia ser um site de futebol ou alguma emissora de TV que deseja mostrar estes dados durante a transmissão do jogo)."},{"type":"h2","text":"Configurando o projeto e dependências essenciais"},{"type":"p","text":"Para começar, no pom.xml (caso use Maven) ou build.gradle, adicione as dependências necessárias para observabilidade e para construir a API REST. As principais são:"},{"type":"pre","text":"\u003cdependency>\n\n    \u003cgroupId>org.springframework.boot\u003c/groupId>\n\n    \u003cartifactId>spring-boot-starter-web\u003c/artifactId>\n\n\u003c/dependency>\n\n\u003cdependency>  \n\n    \u003cgroupId>org.springframework.boot\u003c/groupId>  \n\n    \u003cartifactId>spring-boot-starter-actuator\u003c/artifactId>  \n\n\u003c/dependency>  \n\n\u003cdependency>  \n\n    \u003cgroupId>io.micrometer\u003c/groupId>  \n\n    \u003cartifactId>micrometer-registry-prometheus\u003c/artifactId>  \n\n    \u003cscope>runtime\u003c/scope>  \n\n\u003c/dependency>"},{"type":"p","text":"As funções de cada dependência são: o starter-web puxa o Spring MVC (nosso servidor web embutido, controladores REST etc.), o Actuator adiciona endpoints prontos do Spring Boot para saúde, métricas e monitoramento, e o Micrometer Prometheus Registry adiciona a integração para exportar as métricas no formato que o Prometheus entende. Com essas dependências, o Spring Boot já vai coletar métricas padrão da JVM, do Tomcat, da aplicação (métricas como uso de CPU, memória, contagem de requisições HTTP, tempo de resposta etc.), e expor um endpoint HTTP para servir essas métricas."},{"type":"p","text":"Por padrão, o Actuator do Spring Boot expõe somente alguns endpoints (como o /health) e mantém outros desligados por segurança. Precisamos habilitar o endpoint de métricas do Prometheus. No arquivo de configuração da aplicação (application.properties ou application.yml), adicione:"},{"type":"pre","text":"management.endpoints.web.exposure.include=prometheus"},{"type":"p","text":"Isso garante que o endpoint http://\u003chost>:\u003cporta>/actuator/prometheus fique acessível, exibindo todas as métricas em formato de texto próprio para scraping do Prometheus. Podemos também definir um nome para nossa aplicação e adicionar tags globais, por exemplo em application.properties:"},{"type":"pre","text":"spring.application.name=observability-demo\n\nmanagement.metrics.tags.application=${spring.application.name}"},{"type":"p","text":"As tags são úteis para distinguir métricas caso tenhamos múltiplas aplicações sendo monitoradas no mesmo servidor Grafana, por exemplo. Vale lembrar que o Grafana é a parte visual dos logs e métricas enviadas ao Prometheus, com ele é possível criar Dashboards personalizados."},{"type":"h2","text":"Implementando os endpoints /hello e /slow com métricas"},{"type":"p","text":"Com o projeto configurado, vamos criar nosso controlador REST. Abaixo está o código Java completo do HelloController com os dois endpoints e a instrumentação de métricas usando Micrometer:"},{"type":"pre","text":"@RestController\n\npublic class HelloController {\n\n    private final MeterRegistry meterRegistry;\n\n    // Injeção do MeterRegistry via construtor (o Spring Boot o fornece automaticamente)\n\n    public HelloController(MeterRegistry meterRegistry) {\n\n        this.meterRegistry = meterRegistry;\n\n    }\n\n    @GetMapping(\"/hello\")\n\n    public String hello() {\n\n        // Contador para quantas vezes o endpoint /hello foi chamado\n\n        Counter counter = meterRegistry.counter(\"app_hello_requests_total\");\n\n        counter.increment();\n\n        return \"Hello, World!\";\n\n    }\n\n    @GetMapping(\"/slow\")\n\n    public String slow() throws InterruptedException {\n\n        // Timer para medir a duração da requisição /slow\n\n        Timer timer = Timer.builder(\"app_slow_request_duration\")\n\n                .description(\"Duração das requisições /slow em segundos\")\n\n                .register(meterRegistry);\n\n        // Medir o tempo de execução simulando uma operação lenta\n\n        return timer.record(() -> {\n\n            try {\n\n                Thread.sleep(3000); // simula demora de 3 segundos\n\n            } catch (InterruptedException e) {\n\n                Thread.currentThread().interrupt();\n\n            }\n\n            return \"Slow response\";\n\n        });\n\n    }\n\n}"},{"type":"p","text":"Vamos dissecar o que está acontecendo em cada parte do código acima:"},{"type":"p","text":"@RestController: indica que esta classe define endpoints REST; é um controller do Spring MVC. Cada método anotado com @GetMapping irá atender requisições GET no caminho especificado."},{"type":"p","text":"private final MeterRegistry meterRegistry: o MeterRegistry do Micrometer é o componente onde registramos e atualizamos nossas métricas. Pensando na analogia, ele é a prancheta do técnico onde marcamos os dados coletados dos sensores dos jogadores. O Spring, ao detectar a dependência micrometer-registry-prometheus no classpath, já configura automaticamente um PrometheusMeterRegistry para nós, e o expõe no contexto da aplicação."},{"type":"p","text":"Injeção do MeterRegistry: usamos injeção via construtor (poderia ser @Autowired também) para obter o MeterRegistry no nosso controller. Assim, podemos usá-lo dentro dos métodos para manipular métricas."},{"type":"p","text":"Endpoint /hello: criamos ou obtemos um Counter (contador) por meio de meterRegistry.counter(\"app_hello_requests_total\"). Nomeamos a métrica como \"app_hello_requests_total\" (seguindo convenções do Prometheus de snake_case e sufixo _total para contadores cumulativos). Esse contador representa o número de vezes que o endpoint /hello foi chamado. Chamamos counter.increment() a cada requisição, incrementando em 1. Em seguida, retornamos a String \"Hello, World!\" como resposta normal da API."},{"type":"p","text":"Linha a linha: Counter é apropriado aqui pois é “uma métrica cumulativa que só aumenta ou é zerada quando reinicia” – exatamente o caso de contagem de chamadas. Toda vez que um cliente bate em /hello, nosso “scout” registra mais um no contador, igual a registrar que um jogador tocou na bola mais uma vez."},{"type":"p","text":"Endpoint /slow: aqui, criamos um Timer usando o builder do Micrometer (Timer.builder(\"app_slow_request_duration\"). O nome dado será transformado em métricas no Prometheus, provavelmente expostas como algo como app_slow_request_duration_seconds (o Micrometer costuma adicionar sufixos como _seconds para Timer, que mede tempo em segundos). Adicionamos também uma descrição para documentação. Ao registrar (register(meterRegistry)), obtemos o Timer atrelado ao nosso registry. Em seguida, usamos timer.record(...) para medir o tempo de execução de um trecho de código. Passamos um lambda (Supplier) que simula a operação lenta dormindo 3 segundos. O valor retornado pelo lambda (\"Slow response\") será também retornado pelo método slow(), de forma que a resposta HTTP será essa string. O Timer automaticamente registra a duração da execução (3 segundos, neste caso) e atualiza métricas como contagem de chamadas e total de tempo gasto."},{"type":"p","text":"Em outras palavras: estamos medindo quanto tempo as requisições /slow levam. Se 5 clientes chamarem esse endpoint, o Timer terá contado 5 ocorrências, e poderemos obter no Prometheus algo como: quantas vezes /slow foi executado e qual o tempo total e médio. Timer é um tipo de métrica apropriado para duração/latência, geralmente expondo internamente um histograma ou summary de tempos. Na analogia, é como ter um cronômetro medindo quanto tempo durou uma certa jogada – por exemplo, quanto tempo o time levou para ir da defesa ao ataque."},{"type":"p","text":"Com esses dois endpoints, nossa aplicação já está gerando métricas personalizadas em conjunto com as métricas padrão do Spring Boot Actuator. Podemos rodar a aplicação (por exemplo, via mvn spring-boot:run ou executando a classe principal gerada pelo Spring Initializr) e testar localmente: ao acessar http://localhost:8080/hello algumas vezes e http://localhost:8080/slow (cuidado, ele demora \\~3 segundos mesmo), teremos alimentado nossas métricas."},{"type":"p","text":"Se visitarmos http://localhost:8080/actuator/prometheus no navegador, veremos um textão contendo diversas linhas de métricas. Procure pelas que adicionamos, elas devem aparecer assim (exemplo):"},{"type":"pre","text":"# HELP app_hello_requests_total  \n\n# TYPE app_hello_requests_total counter\n\napp_hello_requests_total 5.0\n\n# HELP app_slow_request_duration_seconds  \n\n# TYPE app_slow_request_duration_seconds summary\n\napp_slow_request_duration_seconds_count 2.0\n\napp_slow_request_duration_seconds_sum 6.0087123"},{"type":"p","text":"Acima, hipoteticamente o /hello foi chamado 5 vezes, e o /slow 2 vezes com um total de ~6 segundos gastos (portanto em média ~3s cada). Essas informações estão no formato que o Prometheus entende. 🎉 Nossa aplicação já está instrumentada – os “jogadores” (microserviços/endpoints) estão usando os sensores e reportando dados."},{"type":"p","text":"(Observação: poderíamos ainda instrumentar outras métricas – por exemplo, um Gauge para alguma variável em tempo real, ou acrescentar tags nas métricas para diferenciar por parâmetros, etc. Mas para manter o foco, vamos prosseguir com essas duas métricas personalizadas simples. O importante é que entendemos o processo de instrumentação com Micrometer.)"},{"type":"h2","text":"Recommended by LinkedIn"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/C4E12AQHObj42Kul5nw/article-cover_image-shrink_720_1280/article-cover_image-shrink_720_1280/0/1582850955134?e=2147483647&v=beta&t=xR8_WPYZgk8LBJ9VFAxG_qqLFZhvXHx_IIzF5c2JKLc","alt":"A nova era da análise de dados no esporte","local":"article-inline-918652ac0488db12.jpg"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQHihPxgfIiaww/article-cover_image-shrink_720_1280/B4DZqN6ioHJcAI-/0/1763317525840?e=2147483647&v=beta&t=hw6KeyCdKOO4m9mv5ytZdSRJKwc2pxsa-NQqJWQJ5u4","alt":"Do olheiro ao algoritmo: como o Moneyball com IA vai redefinir o jogo","local":"article-inline-c2c4cabdcc5618ba.jpg"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQFep9oX_sc4lw/article-cover_image-shrink_720_1280/B4DZ8FnMD7GkAQ-/0/1782505589141?e=2147483647&v=beta&t=HBELKERrXDLngPL5dhT3M5b8pRoSjpTDMtt9Hc4l_d0","alt":"Dados e Informação: O Cérebro do Novo Futebol","local":"article-inline-ce96c3829b16badd.png"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQHE1edFv6BH_g/article-inline_image-shrink_1500_2232/B4DZd58PzLHMCw-/0/1750097526265?e=2147483647&v=beta&t=DPaDxleQMw_YVMJ0X48BiVwyuRFTHiubHIEHyDBAIyA","alt":"Article content","local":"article-inline-52273edfe2710103.png"},{"type":"h2","text":"Coletei os dados, e agora? Prometheus em ação (coletando as métricas)"},{"type":"p","text":"Assim como um técnico precisa de um analista ou sistema para coletar os dados dos sensores dos jogadores em campo, nossa aplicação instrumentada por si só não é suficiente – precisamos de algo que reúna essas métricas periodicamente e as armazene para análise. É aí que entra o Prometheus."},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQF5edkt9LvFWQ/article-inline_image-shrink_1000_1488/B4DZd58Py2HkAU-/0/1750097526333?e=2147483647&v=beta&t=TFj2vyK_XOk4eWUHtPfJPtXXY-Je12hT9MmFPKsqwmQ","alt":"Article content","local":"article-inline-b6511af4edf55334.png"},{"type":"p","text":"O Prometheus é uma ferramenta open-source amplamente usada para monitoramento de sistemas e coleta de métricas do tipo séries temporais (cada métrica é armazenada como pares valor + timestamp). Ele funciona com um modelo pull: o servidor do Prometheus periodicamente faz requisições HTTP aos endpoints de métricas das aplicações (scraping). No nosso caso, isso significa que o Prometheus ficará acessando http://\u003chost>:8080/actuator/prometheus de tempos em tempos (por exemplo, a cada 5 ou 15 segundos) e puxando todos aqueles números. Ele armazena esses dados em sua base local (um banco de dados de séries temporais embutido). Além disso, o Prometheus permite definir alertas (por exemplo, “latência média acima de 5s por 5 minutos”) e uma linguagem de consulta poderosa chamada PromQL para extrair e agrupar as métricas coletadas."},{"type":"h3","text":"Configuração do Prometheus para nossa aplicação"},{"type":"p","text":"Para usar o Prometheus, podemos rodá-lo localmente via um container Docker, via binário, ou dentro do Kubernetes (já já chegaremos nisso). O importante é configurar o alvo de scraping para incluir nosso aplicativo. A configuração do Prometheus é feita em um arquivo YAML geralmente chamado prometheus.yml. Um bloco de configuração mínimo para nossa app seria:"},{"type":"pre","text":"scrape_configs:\n\n  - job_name: 'observ-demo'\n\n    metrics_path: '/actuator/prometheus'\n\n    scrape_interval: 5s\n\n    static_configs:\n\n      - targets: ['localhost:8080']"},{"type":"p","text":"Esse trecho define um job de scrap chamado \"observ-demo\". O metrics_path /actuator/prometheus indica onde o Prometheus vai buscar as métricas em cada alvo. Em targets, apontamos para o endereço da nossa aplicação – aqui supomos localhost:8080 (se o Prometheus estiver rodando localmente junto à app). O scrape_interval: 5s configura a frequência de coleta (a cada 5 segundos neste exemplo, podendo ser ajustado conforme necessidade). Com isso, ao iniciar o Prometheus com essa config, ele começará a acessar nosso endpoint e coletar as métricas.","links":[{"text":"localhost:8080","url":"https://www.linkedin.com/redir/redirect?url=http%3A%2F%2Flocalhost%3A8080&urlhash=RXZa&trk=article-ssr-frontend-pulse_little-text-block"}]},{"type":"p","text":"Executando o Prometheus localmente: se você tem Docker instalado, pode usar uma imagem oficial. Por exemplo, crie um arquivo prometheus.yml com a configuração acima e rode:"},{"type":"pre","text":"docker run -p 9090:9090 -v /path/para/prometheus.yml:/etc/prometheus/prometheus.yml prom/prometheus:v2.44.0"},{"type":"p","text":"Caso você não tenha o Docker instalado em sua máquina, siga as instruções em sua documentação oficial: https://docs.docker.com/get-started/get-docker/.","links":[{"text":"https://docs.docker.com/get-started/get-docker/","url":"https://docs.docker.com/get-started/get-docker/"}]},{"type":"p","text":"Isso iniciará um container do Prometheus acessível em http://localhost:9090. Na aba Status -> Targets do UI web do Prometheus, você deverá ver nosso target \"observ-demo\" listado como UP (ativo) se tudo estiver correto. A partir daí, o Prometheus está armazenando continuamente os valores das métricas app_hello_requests_total e app_slow_request_duration_seconds, além das diversas outras métricas padrão do sistema. Podemos brincar na interface do Prometheus (aba Graph ou PromQL) executando consultas simples, por exemplo:"},{"type":"li","text":"app_hello_requests_total – vai mostrar o valor atual do contador de requisições /hello."},{"type":"li","text":"rate(app_hello_requests_total[1m]) – mostrará a taxa de requisições /hello por segundo nos últimos 1 minuto (essa função rate calcula a derivada por segundo do contador, útil para métricas de throughput)."},{"type":"li","text":"histogram_quantile(0.95, rate(app_slow_request_duration_seconds_bucket[5m])) – se nosso Timer expõe um histograma de latências, esta consulta (um pouco mais avançada) poderia calcular o percentil 95% da latência do /slow nos últimos 5 minutos, ou seja, quanto tempo 95% das requisições levam para responder (indicando o pior caso comum)."},{"type":"p","text":"Abaixo há um exemplo da interface gráfica desta tela do Prometheus:"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQHiAnFvuUsZDQ/article-inline_image-shrink_400_744/B4DZd58Py3G8AY-/0/1750097526484?e=2147483647&v=beta&t=ptBLo0kAJwu9qMCRnqyw4KyNBVz-nGbiUAgK45K5ElM","alt":"Article content","local":"article-inline-a07f83520059e81a.png"},{"type":"p","text":"Não se preocupe se não conhecer PromQL a fundo – o importante é saber que o Prometheus agora tem os dados e permite esse tipo de análise. Com as métricas coletadas, falta o passo final: apresentá-las de forma visual e amigável, de preferência em tempo real e com alertas. Entra em campo o nosso “telão do estádio”: Grafana."},{"type":"h3","text":"Grafana e Dashboards de Métricas"},{"type":"p","text":"Grafana é uma plataforma open-source de visualização de dados e dashboards, muito popular no mundo de DevOps. Conecta-se a várias fontes de dados (Prometheus, Elasticsearch, InfluxDB, etc.) e permite criar painéis gráficos, gráficos de linhas, gauges, tabelas, mapas de calor, o que você imaginar, para dar vida aos dados coletados. Se o Prometheus é quem coleta as jogadas, o Grafana é quem monta o “vídeo” de melhores momentos e estatísticas para a gente entender a partida 😉."},{"type":"p","text":"Para usar o Grafana localmente, também podemos rodá-lo via Docker, por exemplo:"},{"type":"pre","text":"docker run -p 3000:3000 grafana/grafana:9.5.2"},{"type":"p","text":"Caso você não tenha o Docker instalado em sua máquina, siga as instruções em sua documentação oficial: https://docs.docker.com/get-started/get-docker/.","links":[{"text":"https://docs.docker.com/get-started/get-docker/","url":"https://docs.docker.com/get-started/get-docker/"}]},{"type":"p","text":"Depois acesse http://localhost:3000 no navegador. As credenciais padrão são admin/admin (será pedido para trocar a senha no primeiro login)."},{"type":"h3","text":"Configurando o Grafana com fonte Prometheus"},{"type":"p","text":"No Grafana, precisamos adicionar o Prometheus como fonte de dados. Vá em Configuration -> Data Sources -> Add data source, escolha Prometheus. Informe a URL do Prometheus (por exemplo, http://localhost:9090) e salve. Pronto, o Grafana agora consegue consultar as métricas do Prometheus."},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQHa0-J4WI7sAA/article-inline_image-shrink_1000_1488/B4DZd58PyzGsAY-/0/1750097526205?e=2147483647&v=beta&t=rX2pwPttlPleIa1MVaAzdf5YwMyowNoXdenhVAahAik","alt":"Article content","local":"article-inline-69d79e489298c2c6.png"},{"type":"p","text":"Agora vem a parte divertida: construir um dashboard. Podemos criar um dashboard do zero e ir adicionando painéis (panels), mas vale saber que a comunidade já criou dashboards prontos para Spring Boot/Micrometer. No site da Grafana há um marketplace de dashboards com IDs únicos para importação. Um dashboard genérico muito usado para Spring Boot é o de ID 11378 (Spring Boot Actuator Metrics). Para importar, no Grafana clique em + (Create) -> Import, coloque o número 11378, e ele deverá carregar o template. Selecione sua fonte de dados Prometheus e conclua. Você obterá gráficos pré-configurados mostrando métricas como: número de requisições por segundo, tempo médio de resposta, uso de memória da JVM, threads, etc., tudo automaticamente preenchido pelas métricas do Actuator/Micrometer do Spring Boot."},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQHcEzYG755t_Q/article-inline_image-shrink_1000_1488/B4DZd58PzVGsAU-/0/1750097526316?e=2147483647&v=beta&t=pbKo0I3abSC82IRWIUKAgI9r2c5JSn3EWTBCTSlLwrc","alt":"Article content","local":"article-inline-a2aca6a7d4c77910.png"},{"type":"p","text":"No nosso caso, poderíamos criar um painel específico para as métricas personalizadas que fizemos: por exemplo, um gráfico de linha mostrando a evolução do app_hello_requests_total ao longo do tempo (ou melhor, a taxa de requisições /hello por minuto), e um gráfico ou gauge para a latência média do /slow. Também poderíamos adicionar um painel de texto ou tabela mostrando o valor atual do contador de /hello (quantas vezes foi chamado no total). O Grafana permite muitas customizações – escolha de cores, limites, alertas visuais quando valores excedem um threshold (ex: pintar de vermelho se mais de 10 requisições /slow lentas ocorrerem em 5 min, etc)."},{"type":"p","text":"Dica: o Grafana também permite criar alertas baseados nos dados dos gráficos (desde versões mais recentes, o alerting está unificado). Assim, poderíamos configurar para nos enviar um e-mail ou mensagem no Teams/Slack se, por exemplo, app_slow_request_duration_seconds_sum/app_slow_request_duration_seconds_count (que seria o tempo médio do /slow) exceder 5 segundos em média por 5 minutos. Isso transformaria nossa observabilidade também em ação proativa, semelhante a um alerta ao treinador no banco de reservas quando um jogador atinge seu limite físico e precisa ser substituído."},{"type":"p","text":"É possível, ainda, ter toda essa aplicação em uma arquitetura utilizando Kubernetes, Helm, Istio, de forma orquestrada e instrumental a observabilidade, de forma reutilizável e escalável. Veja esse fantástico vídeo que explica um pouco mais a fundo como chegar a este nível em sua aplicação: clique aqui.","links":[{"text":"clique aqui","url":"https://www.youtube.com/watch?v=5c-o6PKlhEQ&trk=article-ssr-frontend-pulse_little-text-block"}]},{"type":"h2","text":"Conclusão: Apito Final e Lições Aprendidas 🏆"},{"type":"p","text":"Chegamos ao fim desse jogo didático unindo futebol e observabilidade em aplicações Java! Durante essa partida, montamos nosso time de microserviços, instrumentamos cada “jogador” com sensores (Micrometer), coletamos estatísticas com um olheiro dedicado (Prometheus) e analisamos tudo em um telão de última geração (Grafana)."},{"type":"p","text":"Mais do que ganhar de goleada, o objetivo aqui foi mostrar que observabilidade é acessível e essencial em sistemas modernos. Ferramentas como Spring Boot Actuator, Micrometer, Prometheus e Grafana formam um stack poderoso que, com relativamente pouco esforço, lhe dá superpoderes para entender o que se passa dentro da sua aplicação. Assim como nenhum técnico ganharia um campeonato no escuro, sem estatísticas ou análise de desempenho, não dá para escalar aplicações distribuídas sem visibilidade. Logs, métricas e traces não são apenas “perfumaria” – são os fundamentos para resolver problemas antes mesmo que os usuários percebam, para otimizar pontos fracos do sistema, e para ter confiança ao fazer deploys frequentes."},{"type":"p","text":"E o mais bacana: você viu tudo isso aplicado numa aplicação Java real, linha por linha, sob uma ótica divertida. A partir de agora, quando alguém falar em “observabilidade”, espero que você lembre da Copa do Mundo de Clubes: pense nos seus microserviços como um time campeão. Cada microserviço-jogador bem monitorado, cada métrica coletada é uma vitória na prancheta. Com a observabilidade bem implementada, seu time de serviços corre junto, você identifica rápido quem está “fazendo cera” (gargalos de performance) ou quem está “impedido” (erros inesperados), e consegue ajustar a tática para entregar a melhor experiência para o usuário – vencendo, assim, a partida da confiabilidade e desempenho. 🥇"},{"type":"p","text":"Afinal, jogos como Botafogo versus PSG, Fluminense versus Borussia Dortmund, Palmeiras versus Porto, Flamengo versus Chelsea podem ser difíceis mas, também, podem ser nivelados com o uso de dados e observabilidade do que o outro time faz tão bem para replicá-los ao seu time, digo, a sua aplicação."},{"type":"p","text":"Portanto, leve esse troféu de conhecimento para casa e aplique no seu próximo projeto! Invista em observabilidade desde o apito inicial do desenvolvimento. Seus sistemas (e seus usuários, claro) agradecerão. E quando estiver comemorando a estabilidade do seu app em produção, lembre-se: por trás de um grande placar de um jogo, houve muito treino, métricas e trabalho em equipe entre serviços e ferramentas. Parabéns por chegar até aqui, craque! 👏🚀"},{"type":"p","text":"Bons jogos e bons códigos! Em caso de dúvida, os “analistas de desempenho” (comunidade open source, docs, etc.) estão sempre a postos para ajudar. Até a próxima, e que seus microserviços sejam campeões mundiais em observabilidade! 🏆🌍"},{"type":"p","text":"Referências & Leituras Complementares:"},{"type":"li","text":"Spring Boot Actuator – documentação oficial 🔗 https://docs.spring.io/spring-boot/docs/current/reference/html/actuator.html","links":[{"text":"https://docs.spring.io/spring-boot/docs/current/reference/html/actuator.html","url":"https://docs.spring.io/spring-boot/docs/current/reference/html/actuator.html"}]},{"type":"li","text":"Micrometer – documentação oficial 🔗 https://micrometer.io/docs","links":[{"text":"https://micrometer.io/docs","url":"https://micrometer.io/docs"}]},{"type":"li","text":"Micrometer Prometheus Registry 🔗 https://micrometer.io/docs/registry/prometheus","links":[{"text":"https://micrometer.io/docs/registry/prometheus","url":"https://micrometer.io/docs/registry/prometheus"}]},{"type":"li","text":"Prometheus – Getting Started 🔗 https://prometheus.io/docs/introduction/first_steps/","links":[{"text":"https://prometheus.io/docs/introduction/first_steps/","url":"https://prometheus.io/docs/introduction/first_steps/"}]},{"type":"li","text":"PromQL – Prometheus Query Language 🔗 https://prometheus.io/docs/prometheus/latest/querying/basics/","links":[{"text":"https://prometheus.io/docs/prometheus/latest/querying/basics/","url":"https://prometheus.io/docs/prometheus/latest/querying/basics/"}]},{"type":"li","text":"Grafana – Getting Started 🔗 https://grafana.com/docs/grafana/latest/getting-started/","links":[{"text":"https://grafana.com/docs/grafana/latest/getting-started/","url":"https://grafana.com/docs/grafana/latest/getting-started/"}]},{"type":"li","text":"Grafana Dashboards Marketplace (ex: Spring Boot Actuator ID 11378) 🔗 https://grafana.com/grafana/dashboards/11378-spring-boot-actuator-metrics/","links":[{"text":"https://grafana.com/grafana/dashboards/11378-spring-boot-actuator-metrics/","url":"https://grafana.com/grafana/dashboards/11378-spring-boot-actuator-metrics/"}]},{"type":"li","text":"Spring Boot + Prometheus + Grafana Tutorial (Altimetrik) 🔗 https://altimetrik.com/blog/spring-boot-micrometer-prometheus-and-grafana/","links":[{"text":"https://altimetrik.com/blog/spring-boot-micrometer-prometheus-and-grafana/","url":"https://altimetrik.com/blog/spring-boot-micrometer-prometheus-and-grafana/"}]},{"type":"li","text":"Dev.to - Observability (Metrics) in Spring Boot 🔗 https://dev.to/credemnation/observability-part-1-metrics-in-spring-boot-4g1p","links":[{"text":"Dev.to","url":"https://www.linkedin.com/redir/redirect?url=http%3A%2F%2FDev%2Eto&urlhash=p2Jw&trk=article-ssr-frontend-pulse_little-text-block"},{"text":"https://dev.to/credemnation/observability-part-1-metrics-in-spring-boot-4g1p","url":"https://dev.to/credemnation/observability-part-1-metrics-in-spring-boot-4g1p"}]},{"type":"li","text":"Baeldung – Spring Boot Actuator Guide 🔗 https://www.baeldung.com/spring-boot-actuators","links":[{"text":"https://www.baeldung.com/spring-boot-actuators","url":"https://www.baeldung.com/spring-boot-actuators"}]},{"type":"li","text":"BellSoft – Monitoring in Kubernetes with Prometheus and Grafana 🔗 https://bell-sw.com/blog/spring-boot-monitoring-in-kubernetes-with-prometheus-and-grafana/","links":[{"text":"https://bell-sw.com/blog/spring-boot-monitoring-in-kubernetes-with-prometheus-and-grafana/","url":"https://bell-sw.com/blog/spring-boot-monitoring-in-kubernetes-with-prometheus-and-grafana/"}]},{"type":"li","text":"Vericode Blog – Logs, Métricas e Traces: os 3 pilares da Observabilidade 🔗 https://vericode.com.br/logs-metricas-e-traces-os-3-pilares-da-observabilidade/","links":[{"text":"https://vericode.com.br/logs-metricas-e-traces-os-3-pilares-da-observabilidade/","url":"https://vericode.com.br/logs-metricas-e-traces-os-3-pilares-da-observabilidade/"}]},{"type":"li","text":"Kubernetes Docs – ConfigMap 🔗 https://kubernetes.io/docs/concepts/configuration/configmap/","links":[{"text":"https://kubernetes.io/docs/concepts/configuration/configmap/","url":"https://kubernetes.io/docs/concepts/configuration/configmap/"}]},{"type":"li","text":"Prometheus + Kubernetes com Helm (kube-prometheus-stack) 🔗 https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack","links":[{"text":"https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack","url":"https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack"}]},{"type":"li","text":"Jaeger (Tracing Distribuído) 🔗 https://www.jaegertracing.io/","links":[{"text":"https://www.jaegertracing.io/","url":"https://www.jaegertracing.io/"}]}],"retrieved":"2026-10-07"},"10":{"id":10,"title":"TCP, HTTP, DNS? O frio chegou e, com isso, uma sopinha de letrinhas cai bem.","url":"https://www.linkedin.com/pulse/tcp-http-dns-o-frio-chegou-e-com-isso-uma-sopinha-de-letrinhas-m3dtf/","blocks":[{"type":"h3","text":"Introdução"},{"type":"p","text":"Você já se perguntou o que realmente acontece quando clica num link?"},{"type":"p","text":"Parece simples: você aperta “Enter” e boom — um site aparece. Mas por trás disso existe uma das obras de engenharia mais complexas e fascinantes do mundo moderno: as redes de computadores."},{"type":"p","text":"Esse artigo é para você que quer sair do zero e terminar sabendo mais do que muita gente que trabalha com TI. E a jornada será leve, com analogias, exemplos práticos, explicações visuais e muito \"por trás da cortina\"."},{"type":"p","text":"Vamos jogar as redes no mar do conhecimento? (TAN DAM) 😅"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQFLANty2_-2Hg/article-inline_image-shrink_1000_1488/B4DZdV0vuUGYAQ-/0/1749491583276?e=2147483647&v=beta&t=B7ozT-lcTunoYBM2T2CPv4-cJ6XD1extjGUnEvGOLBE","alt":"Article content","local":"article-inline-d2195a0b6c693dbc.png"},{"type":"h3","text":"Parte 1: Fundamentos Essenciais — O que é uma rede, afinal?"},{"type":"p","text":"Imagine um monte de computadores sozinhos. Cada um vivendo sua vida. Agora, conecte eles com fios ou ondas de rádio e diga: \"conversem\". Isso é uma rede. Simples assim."},{"type":"h3","text":"Definição Técnica:"},{"type":"p","text":"Rede de computadores é um conjunto de dispositivos interconectados que trocam dados entre si. Esses dispositivos podem ser PCs, servidores, switches, roteadores, sensores, geladeiras inteligentes, e até torradeiras."},{"type":"h3","text":"Tipos de Redes (visão geral):"},{"type":"li","text":"LAN (Local Area Network): Dentro da sua casa ou empresa."},{"type":"li","text":"WAN (Wide Area Network): Conexões entre redes distantes (a Internet é a maior delas)."},{"type":"li","text":"MAN, PAN, WLAN... — outras siglas que valem aprender depois."},{"type":"p","text":"Analogia: Imagine uma cidade. Cada casa é um computador. As ruas são os cabos. O carteiro (protocolo - guarde bem essa informação) leva mensagens de uma casa para outra."},{"type":"h3","text":"Parte 2: A Anatomia de uma Comunicação — Do clique à resposta"},{"type":"p","text":"Quando você acessa um site, o que acontece? Vamos abrir essa caixa-preta em passos detalhados:"},{"type":"h3","text":"1. O navegador envia a requisição"},{"type":"li","text":"Você digita www.exemplo.com"},{"type":"li","text":"O navegador precisa descobrir o IP correspondente. Vale lembrar que o IP é o \"RG\" que identifica um computador dentro de uma rede de computadores, ou seja, que identifica o seu endereço. Para que não precisemos guardar aqueles \"trocentos\" números de IP (como 123.554.332.455, por exemplo, de cada site ou aplicativo), o DNS entra em cena para nos ajudar."},{"type":"h3","text":"2. O DNS entra em cena"},{"type":"li","text":"DNS é como a agenda de contatos da internet."},{"type":"li","text":"Seu computador consulta um servidor DNS para saber que IP corresponde ao domínio digitado."},{"type":"h3","text":"Ferramentas:"},{"type":"pre","text":"dig exemplo.com\nnslookup exemplo.com"},{"type":"h3","text":"3. O IP é obtido — agora sim podemos \"enviar\""},{"type":"li","text":"Com o IP em mãos, o computador monta um pacote IP."},{"type":"li","text":"Ele também define a porta de destino (443 se for HTTPS)."},{"type":"h3","text":"4. O pacote passa por seu roteador (e NAT)"},{"type":"li","text":"Seu roteador tem IP público. Dentro da sua rede (192.168.x.x), seu computador tem um IP interno."},{"type":"li","text":"O NAT (Network Address Translation) substitui o IP de origem para que o pacote viaje pela internet."},{"type":"h3","text":"5. O pacote percorre a Internet"},{"type":"li","text":"Passa por vários roteadores (\"saltos\") até chegar ao servidor do site ou aplicação de destino."},{"type":"li","text":"Cada roteador lê o destino e decide para onde mandar a seguir."},{"type":"h3","text":"Ferramentas:"},{"type":"pre","text":"traceroute exemplo.com"},{"type":"h3","text":"6. O servidor responde"},{"type":"li","text":"O servidor recebe o pacote, processa a requisição e envia a resposta."},{"type":"li","text":"O caminho de volta é parecido, mas nem sempre idêntico."},{"type":"h3","text":"7. A página aparece no seu navegador"},{"type":"li","text":"Agora você vê o site. Mas ele provavelmente carregou recursos de outros servidores (CDNs, APIs, fontes)."},{"type":"h2","text":"Recommended by LinkedIn"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQHMjdXjyIqavg/article-cover_image-shrink_720_1280/article-cover_image-shrink_720_1280/0/1730749187054?e=2147483647&v=beta&t=ltLpCFvO4RJ1UIk4cqj4YksHAEGjgHwasZmscJqP0Tg","alt":"Sincronização Segura em Grande Escala: Como Implementar NTS no pool.ntp.org?","local":"article-inline-55bc9470124a6d57.png"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D5612AQGWdjdzZDROSQ/article-cover_image-shrink_720_1280/B56ZjoSCavIAAY-/0/1756243706783?e=2147483647&v=beta&t=okILlrXnRZV-O-XsEa1kXg54KW4MoUXHS-AcXG-n20g","alt":"Redes, Automação e os Problemas do Dia a Dia: O que Estamos Perdendo?","local":"article-inline-2b794382a67147a2.png"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQGvXuZXsrX0LQ/article-cover_image-shrink_720_1280/B4DZ4cJgdAHAAI-/0/1778588722116?e=2147483647&v=beta&t=4Wpf-7anXQH5VvEgyNjwatMrZXiU5vhehzmNEKJoX0M","alt":"OSPF vs BGP: entendendo o papel de cada protocolo em redes profissionais","local":"article-inline-f2b62a6fe5596bf2.png"},{"type":"h3","text":"Parte 3: Camadas de Rede (Modelo OSI e TCP/IP)"},{"type":"p","text":"Vamos falar da base teórica que organiza toda a comunicação digital: o modelo OSI."},{"type":"h3","text":"As 7 camadas OSI:"},{"type":"li","text":"Física — cabos, sinais, conectores"},{"type":"li","text":"Enlace (Data Link) — MAC Address, switches"},{"type":"li","text":"Rede (Network) — IP, roteadores"},{"type":"li","text":"Transporte — TCP/UDP"},{"type":"li","text":"Sessão — gerenciamento de conexões"},{"type":"li","text":"Apresentação — criptografia, compressão"},{"type":"li","text":"Aplicação — HTTP, FTP, DNS"},{"type":"p","text":"Resumo: Pense como camadas de uma carta: do envelope (camada 1) até o texto (camada 7). Cada camada empacota a anterior."},{"type":"h3","text":"Modelo TCP/IP (prático e real):"},{"type":"li","text":"Aplicação"},{"type":"li","text":"Transporte"},{"type":"li","text":"Internet (IP)"},{"type":"li","text":"Acesso à rede"},{"type":"h3","text":"Parte 4: Protocolos Importantes"},{"type":"li","text":"IP (Internet Protocol): Identifica dispositivos (endereços IP)"},{"type":"li","text":"TCP/UDP: Gerencia como os dados chegam"},{"type":"li","text":"TCP: confiável, ordenado (web, e-mail)"},{"type":"li","text":"UDP: rápido, sem confirmação (streaming, jogos)"},{"type":"li","text":"DNS: Resolve nomes para IPs"},{"type":"li","text":"HTTP/HTTPS: Envio e recebimentos de dados na Web"},{"type":"li","text":"TLS/SSL: Envio e recebimento de dados para segurança utilizando criptografia"},{"type":"h3","text":"Parte 5: Ferramentas Para Analisar e Diagnosticar"},{"type":"h3","text":"Wireshark"},{"type":"li","text":"Captura pacotes"},{"type":"li","text":"Mostra quem está conversando com quem"},{"type":"li","text":"Permite ver o conteúdo real dos pacotes (em HTTPS, criptografado)"},{"type":"h3","text":"tcpdump"},{"type":"pre","text":"tcpdump -i eth0 port 80"},{"type":"h3","text":"nmap"},{"type":"li","text":"Scaneia portas abertas"},{"type":"li","text":"Detecta serviços em execução"},{"type":"h3","text":"netstat / ss"},{"type":"li","text":"Mostra conexões ativas e portas escutando"},{"type":"p","text":"Para entender como usa-las em seu computador, basta realizar uma pesquisa rápida pelo Google ou utilizando um ChatGPT, por exemplo, que é possível verificar alguns tutoriais bem rápidos para prosseguir."},{"type":"h3","text":"Parte 6: Os \"meio-de-campo\" de redes"},{"type":"li","text":"Firewall: Controla o que entra e sai (baseado em regras)"},{"type":"li","text":"NAT: Traduz endereços internos para um IP externo"},{"type":"li","text":"Proxy: Intermediário entre cliente e servidor (para cache, segurança, anonimato)"},{"type":"h3","text":"Parte 7: Diagnóstico na Prática - \"Por que meu site não carrega?\""},{"type":"li","text":"Pingou o site?"},{"type":"li","text":"DNS está resolvendo?"},{"type":"li","text":"Traceroute mostra onde para?"},{"type":"li","text":"Porta 443 está aberta no servidor?"},{"type":"li","text":"Firewall local bloqueando?"},{"type":"li","text":"Alguma rota errada no NAT?"},{"type":"h3","text":"Mitos Comuns (e verdades escondidas)"},{"type":"li","text":"\"Wi-Fi lento é culpa da internet\" — pode ser interferência, congestionamento de canal."},{"type":"li","text":"\"Se tenho IP, acesso o site\" — em servidores com virtual host, não é tão simples. Podem haver camadas de segurança que, mesmo sabendo o IP do servidor, proxies ou firewalls não permitem que você possa acessar."},{"type":"li","text":"\"HTTPS é 100% seguro\" — protege o trânsito, mas o servidor ainda pode ser comprometido."},{"type":"h3","text":"Diagrama de exemplo de um fluxo de rede:"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQEvdRE7w5itlA/article-inline_image-shrink_400_744/B4DZdV3wNTHkAY-/0/1749492386845?e=2147483647&v=beta&t=uQft5-nwryAvpBV0zOb0yZgD1vnR1Q1oQo-BUoKYpYg","alt":"Article content","local":"article-inline-4d057a9d1757147c.png"},{"type":"p","text":"Acima é possível visualizar um exemplo de uma conexão em uma rede de computadores. O computador (mais a esquerda) possui um IP interno em sua rede local (LAN), o 192.168..., e, para poder se comunicar com outros computadores, ele passa por um roteador, normalmente o de internet, que faz essa tradução (NAT - Network Address Translator) para um IP externo que será usado no ambiente da internet."},{"type":"p","text":"O roteador, então, transmite esse dado até o destino (normalmente em uma rede de internet, vários roteadores se comunicam para que esses dados sejam transmitidos entre origem e destino). Ao chegar no destino, o servidor processa a requisição enviada pelo computador de origem. Essa comunicação segue protocolos de rede padronizados: o IP opera na camada de rede, o TCP garante a entrega na camada de transporte, e o HTTP é utilizado na camada de aplicação (modelo OSI) para transferência de conteúdo web."},{"type":"p","text":"Há muito ainda para se ver em relação a redes de computadores, com conteúdos que vão do hardware até conceitos mais avançados, mas espero que, com este artigo, você já tenha um rumo para continuar perseguindo o entendimento de como as coisas funcionam nestas comunicações entre computadores e o que são essas sopinhas de letrinhas nessas estruturas."},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQFw6aP0sNignA/article-inline_image-shrink_1000_1488/B4DZdV6o1XH4AY-/0/1749493125422?e=2147483647&v=beta&t=p-qhTi5NWuvpSC3iU7SS8jKyNPaHRvHvYWhNUP5svZg","alt":"Article content","local":"article-inline-526cdd39ef57782b.png"}],"retrieved":"2026-10-07"},"11":{"id":11,"title":"Redes Neurais? Usando seus próprios neurônios para aprender","url":"https://www.linkedin.com/pulse/redes-neurais-usando-seus-pr%C3%B3prios-neur%C3%B4nios-para-aprender-vieira-cpkbf/","blocks":[{"type":"p","text":"Você já se perguntou como um computador consegue reconhecer faces em fotos ou entender comandos de voz?"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQFNsnhDBmFlPw/article-inline_image-shrink_1500_2232/B4DZb4B0mqHEAc-/0/1747917951449?e=2147483647&v=beta&t=l4GZ9IbGX5nOY0S356HmIivT-yVaAJzrRIQL1Gzfuqs","alt":"Article content","local":"article-inline-a132af14fc42af74.gif"},{"type":"p","text":"Por trás dessas façanhas estão modelos de aprendizado de máquina, em especial as redes neurais artificiais. Neste artigo, vamos guiar você – que talvez seja totalmente leigo no assunto – em uma jornada do básico ao avançado. Começaremos explicando o que é aprendizado supervisionado, depois o que é uma rede neural artificial, e então partiremos para um exemplo prático usando Keras para classificar dígitos escritos à mão (o clássico dataset MNIST). Cada linha de código será explicada em detalhes técnicos e com analogias para reforçar a intuição. Também vamos apresentar um diagrama visual da arquitetura da rede neural construída. Por fim, discutiremos por que é importante aprender sobre redes neurais hoje – incluindo aplicações reais, oportunidades de carreira e implicações futuras – e sugeriremos próximos passos para você se aprofundar, como redes neurais mais avançadas (CNN, RNN, Transformers), conceitos adicionais (overfitting, dropout) e recursos recomendados para continuar seus estudos."},{"type":"p","text":"Preparado? Então vamos lá!"},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQHsVf2WAcXA7g/article-inline_image-shrink_400_744/B4DZb4CwYhG8AY-/0/1747918195261?e=2147483647&v=beta&t=ZLLrEvfyVVIv1jPxdxAbUxxG_4vPGk9bHu8MHi-1BGA","alt":"Article content","local":"article-inline-fdb435107831e61f.gif"},{"type":"h3","text":"O que é Aprendizado Supervisionado?"},{"type":"p","text":"Imagine que você está aprendendo a resolver problemas de matemática usando flashcards. De um lado do cartão está o problema (por exemplo, “2 + 2”), e do outro lado está a resposta correta (“4”). Você tenta resolver o problema e então confere se acertou. Com o tempo, ao praticar com muitos cartões, você começa a reconhecer padrões e a acertar mais frequentemente. Isso é aprendizado supervisionado em essência: você (o “modelo”) recebe exemplos de entrada e suas saídas corretas (respostas esperadas) e ajusta seu “entendimento” até conseguir mapear entradas novas para as saídas corretas."},{"type":"p","text":"Em termos formais, Aprendizado Supervisionado é uma técnica de machine learning em que um algoritmo aprende a partir de um conjunto de dados de treinamento rotulados – isto é, cada exemplo de entrada vem acompanhado do rótulo ou resultado correto. O algoritmo vasculha esses exemplos e “entende” a relação entre as características de entrada e o rótulo de saída para, assim, conseguir prever a saída correta para novos dados que nunca viu. É “supervisionado” porque alguém (um “supervisor”) forneceu as respostas certas durante o treinamento, como um professor corrigindo as tarefas de um aluno."},{"type":"h2","text":"Pense nisso como se fosse um jogo da memória. De tanto você ver uma carta (dado) e ver o lugar que ela se encontra (resultado - objetivo), você memoriza suas localizações. Ou seja, quanto mais treino na memória, mais assertivo você fica. Assim também é com um modelo de inteligência artificial supervisionado."},{"type":"p","text":"Sendo assim:"},{"type":"li","text":"Entrada (features): é o dado que você fornece ao modelo. Pode ser uma imagem, um texto, uma tabela de números etc. No nosso exemplo dos flashcards, a entrada era a pergunta de matemática."},{"type":"li","text":"Saída (rótulo): é o resultado esperado que o modelo deve aprender a produzir. No flashcard, o rótulo era a resposta no verso do cartão."},{"type":"li","text":"Modelo: é o algoritmo que faz a previsão. Ele “ajusta” seus parâmetros internos ao ver muitos exemplos, tentando minimizar os erros. Podemos imaginá-lo como um estudante que ajusta seu conhecimento conforme vai errando ou acertando perguntas."},{"type":"p","text":"Como funciona? O modelo faz uma previsão para cada exemplo de treino, compara com o rótulo correto e calcula um erro (também chamado de loss, ou perda). Em seguida, ele ajusta seus parâmetros (seus “palpites”) um pouquinho na direção de diminuir esse erro. Esse processo se repete para muitos exemplos, inúmeras vezes, até que o modelo esteja bom em acertar as respostas. Podemos pensar nisso como um aluno que recebe feedback de um professor: cada vez que erra, ele aprende com o erro e tenta não repeti-lo."},{"type":"p","text":"Existem muitos exemplos de aprendizado supervisionado no dia a dia. Quando você usa um aplicativo que identifica plantas a partir de fotos, por trás dele há um modelo treinado com milhares de imagens de plantas (entradas) e os nomes/espécies correspondentes (rótulos). Quando o app acerta a planta da sua foto, é porque ele já aprendeu, a partir de exemplos rotulados, quais padrões de pixels correspondem a qual espécie. Outros exemplos incluem filtragem de spam (o modelo aprende a partir de emails já marcados como “spam” ou “não spam”), reconhecimento de voz (treinado com gravações de áudio e transcrições corretas) e previsão do valor de imóveis (treinado com dados de casas e seus preços de venda). Em todos esses casos, há alguém que forneceu exemplos com resposta certa para que a máquina aprendesse."},{"type":"h2","text":"Por este motivo, os dados são os novos petróleos. Com mais dados, mais assertivos os modelos supervisionados ficam."},{"type":"image","url":"https://media.licdn.com/dms/image/v2/D4D12AQGLVb7fFdqtnw/article-inline_image-shrink_1000_1488/B4DZb4EVC2GwAY-/0/1747918607147?e=2147483647&v=beta&t=2mLrKTnIM5X4oz3O7zZwkEWsiEG2NBqnf5Y6VU2CG_E","alt":"Article content","local":"article-inline-63bfcf3023ab8b0b.jpg"},{"type":"h3","text":"Show! Mas, o que é uma Rede Neural Artificial?"},{"type":"p","text":"Agora que entendemos o que é aprendizado supervisionado, vamos focar em um tipo específico (e poderoso) de modelo supervisionado: a rede neural artificial. O nome assusta à primeira vista, mas a ideia pode ser explicada de forma bem intuitiva."},{"type":"p","text":"Em poucas palavras, uma rede neural é um algoritmo de aprendizado inspirado no cérebro humano. Assim como o cérebro é composto por neurônios conectados entre si, uma rede neural artificial consiste em várias unidades simples de cálculo chamadas neurônios ou nós, conectadas umas às outras e organizadas em camadas. Cada conexão entre neurônios tem um peso (um número) que indica o quão forte é a influência de um neurônio sobre o outro. Durante o treinamento, esses pesos são ajustados automaticamente – é assim que a rede “aprende” com os dados."},{"type":"p","text":"Vamos co
